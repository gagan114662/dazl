  <meta name="description" content="The AI orchestration of your wildest imagination.

n8n is the open workflow orchestration platform built for the new era of AI. We give technical teams the freedom of code with the speed of no-code, so they can automate faster, smarter, and without limits. Backed by a fiercely inventive community and 500+ builder-approved integrations, we’re changing the way people bring systems together and scale ideas for impact.

Since our founding in 2019, we’ve grown into a diverse team of over 260 - working across Europe and the US, connected by a shared builder spirit and with our centre of gravity in Berlin. Along the way, we’ve:

 - Cultivated a community of more than 650,000 active developers and builders

 - Earned 190K+ GitHub stars, making us one of the world’s Top 40 most popular projects

 - Backed by top investors, from Sequoia’s first German seed to our SAP&#39;s recent strategic investment - bringing us to a $5.2bn valuation


That’s the company we’ve built. Now we’d love to see what you can build. If you’re applying, try n8n out - whether you’re technical or not - and share a screenshot of your first workflow with us. The easiest place to start is here: app.n8n.cloud/register http://app.n8n.cloud/register.

We’re in a defining moment of an incredible journey. Come and build with us.

3 days per week in our London office


BUILD YOUR ENTERPRISE SALES CAREER AT N8N

n8n is growing rapidly at the intersection of AI, automation and enterprise software. More than 1.7 million active builders use n8n each month, and we’re scaling our enterprise business as more organisations look for ways to connect AI with the systems, data and workflows that run their businesses.

We’re building our SDR team in London and looking for a Sales Development Representative to join us.

You’ll partner closely with Enterprise Account Executives to break into some of the largest organisations in the SEMEA region. This isn’t about maximising email volume. You’ll take a thoughtful, account-based approach: researching strategic companies, identifying the right stakeholders, understanding their priorities, and creating relevant conversations around automation and AI.

If you’re succeeding in an SDR/BDR role and want greater exposure to enterprise selling, strategic account planning, technical buyers and a genuine path towards AE, this could be a great next step.


WHY YOU WILL THRIVE AT N8N?

Serious momentum. n8n has grown rapidly into a major player in workflow automation and AI, with more than $100M in ARR, 1,400+ enterprise customers, and a $5.2B valuation following strategic investment from SAP.

Build towards AE. We want the SDR role to be a platform for your next step. High-performing SDRs can develop through our structured SDR → AE programme, with live deal exposure, discovery and MEDDPICC coaching, call reviews, and opportunities to take greater ownership of real opportunities alongside experienced AEs.

Learn enterprise selling. Work alongside Enterprise AEs on account strategy, stakeholder mapping, messaging, discovery and opportunity creation - gaining exposure to how complex enterprise deals are built from the start.

Sell where the market is going. You’ll engage technical and executive buyers around AI, automation and some of the most important technology challenges businesses are tackling today.

Use AI to sell smarter. Experiment with AI, n8n and modern sales technology to research accounts, understand buyers, personalise outreach and improve how you work. You don’t need to be an engineer - but you should be curious about technology and excited to learn.


WHAT YOU’LL DO;

 - Build enterprise pipeline: Prospect into a focused set of strategic accounts and create qualified opportunities.

 - Develop account strategies: Partner with Enterprise AEs to identify priority companies, stakeholders, challenges, use cases and engagement strategies.

 - Research your prospects: Understand the business and technical priorities of stakeholders across IT, DevOps, SecOps, Engineering and related teams.

 - Create outreach that gets attention: Develop thoughtful, personalised messaging tied to real account priorities rather than generic sequences.

 - Prospect across channels: Engage prospects through email, phone, LinkedIn and other relevant channels.

 - Lead early-stage discovery: Understand business needs, technical environments, priorities, urgency and potential fit with n8n.

 - Continuously improve: Use Salesforce, Outreach, Apollo, AI tools, coaching and performance data to sharpen your approach.


WHAT WE’RE LOOKING FOR;

We’re looking for someone with a strong SDR foundation who wants to develop into an excellent enterprise seller.

You’ll likely be a good fit if you have:

 - SDR or BDR experience in B2B SaaS, software or technology

 - Experience generating pipeline through outbound prospecting within mid- market or enterprise accounts

 - A strong sales track record against your targets

 - Fluency in English (verbal and written) + fluent/bilingual (C1) French is beneficial

 - Confidence engaging senior business and technical stakeholders

 - A thoughtful approach to account research, personalisation and qualification

 - Curiosity about technical products, automation and AI

 - Resilience, consistency and ownership of your results

 - The ability to work from our London office three days per week

Bonus points if you have: experience prospecting into technical audiences; familiarity with buying committees, Salesforce, Outreach, Apollo or MEDDPICC; experience using AI or automation in your own sales workflow.


WHAT SUCCESS LOOKS LIKE

Success here is about quality, not just activity.

You’ll build a deep understanding of your accounts, identify the right stakeholders, create messaging that earns attention and generate qualified enterprise opportunities that can turn into meaningful revenue.

Along the way, you’ll build experience in enterprise account strategy, technical selling, discovery, AI and automation, and complex B2B sales - giving you a strong foundation for the next stage of your career.


INTERESTED?

You don’t need to meet every requirement to apply.

If you have a strong foundation in outbound sales, you’re curious about technology, and you’re excited by the opportunity to help build n8n’s enterprise business while developing towards your next step in sales, we’d love to hear from you.

n8n is an equal opportunity employer and does not discriminate on the basis of race, religion, colour, national origin, gender, sexual orientation, gender identity, age, marital status, veteran status, or disability status.

We can sponsor visas to Germany; for any other country, you need to have existing right to work.

Our company language is English.

You care about diversity and inclusion? We do too! Check out our Diversity, Inclusion and Belonging initiatives at n8n https://www.notion.so/Diversity-inclusion-and-belonging-n8n-c1bec2fff536422d868b1a438d990e35?pvs=21 (https://www.notion.so/n8n/Diversity-inclusion-and-belonging-n8n-c1bec2fff536422d868b1a438d990e35).




Location disclaimer: If you see multiple job postings for the same role, it is most likely because we&#39;re hiring remotely for this role and posting in different locations to make sure every potential candidate can see the role. Please apply to the location you&#39;re the most likely to work from in the future. 


BENEFITS 

 - Competitive compensation 💸 – We offer fair and attractive pay.

 - Ownership 💪 – Our core value is to “empower others,” and we mean it—you’ll get a slice of n8n with equity.

 - Work/life balance 🏖️ – We work hard but ensure you have time to recharge:
   
   - Europe: 30 days of vacation, plus public holidays wherever you are.
   
   - US: 20 vacation days, 8 sick days, plus public holidays wherever you are.

 - Health &amp; wellness 🩺 –
   
   - Europe: We provide benefits according to local country norms.*
   
   - US: Multiple low-premium, low-deductible medical plans with coverage for individuals and families—plus a no-cost premium HDHP option with a pre-seeded HSA—along with dental and vision coverage.

 - Future planning 💰 –
   
   - Europe: We provide pension contributions according to local country norms.*
   
   - US: 401(k) retirement plan with a 4% employer match.

 - Financial security 🛡️ –
   
   - Europe: We provide benefits according to local country norms.*
   
   - US: Company-paid short-term and long-term disability insurance, plus life insurance to support you and your loved ones.

 - Career growth 📈 – We hire rising stars who grow with us! You’ll get €1K (or equivalent) per year to spend on courses, books, events, or coaching to level up your skills.

 - A passionate team 🤩 – We love our product, and we prove it with regular hackathons where we see who can build the coolest thing with it!

 - Remote-first 🌏 – Our team works remotely across Europe, with regular off-sites for team bonding. Some roles, like sales in the US, are hybrid—please check the job description.

 - Giving back 🤝 – We&#39;re big fans of open source, and you&#39;ll get $100 per month to support projects you care about.

 - Transparency 🙏 – We all know what everyone’s working on, how the company is doing—the whole shebang.

*Country and/or State specific details provided in your employment agreement." />

min-height:1.5em\"><strong>3 days per week in our London office</strong></p><p style=\"min-height:1.5em\"></p><h2><strong>Build your enterprise sales career at n8n</strong></h2><p style=\"min-height:1.5em\">n8n is growing rapidly at the intersection of <strong>AI, automation and enterprise software</strong>. More than 1.7 million active builders use n8n each month, and we’re scaling our enterprise business as more organisations look for ways to connect AI with the systems, data and workflows that run their businesses.</p><p style=\"min-height:1.5em\">We’re building our SDR team in London and looking for a <strong>Sales Development Representative</strong> to join us.</p><p style=\"min-height:1.5em\">You’ll partner closely with Enterprise Account Executives to break into some of the largest organisations in the SEMEA region. <strong>This isn’t about maximising email volume.</strong> You’ll take a thoughtful, account-based approach: researching strategic companies, identifying the right stakeholders, understanding their priorities, and creating relevant conversations around automation and AI.</p><p style=\"min-height:1.5em\">If you’re succeeding in an SDR/BDR role and want greater exposure to <strong>enterprise selling, strategic account planning, technical buyers and a genuine path towards AE</strong>, this could be a great next step.</p><p style=\"min-height:1.5em\"></p><h2><strong>Why you will thrive at n8n?</strong></h2><p style=\"min-height:1.5em\"><strong>Serious momentum.</strong> n8n has grown rapidly into a major player in workflow automation and AI, with more than $100M in ARR, 1,400+ enterprise customers, and a $5.2B valuation following strategic investment from SAP.</p><p style=\"min-height:1.5em\"><strong>Build towards AE.</strong> We want the SDR role to be a platform for your next step. High-performing SDRs can develop through our structured <strong>SDR → AE programme</strong>, with live deal exposure, discovery and MEDDPICC coaching, call reviews, and opportunities to take greater ownership of real opportunities alongside experienced AEs.</p><p style=\"min-height:1.5em\"><strong>Learn enterprise selling.</strong> Work alongside Enterprise AEs on account strategy, stakeholder mapping, messaging, discovery and opportunity creation - gaining exposure to how complex enterprise deals are built from the start.</p><p style=\"min-height:1.5em\"><strong>Sell where the market is going.</strong> You’ll engage technical and executive buyers around AI, automation and some of the most important technology challenges businesses are tackling today.</p><p style=\"min-height:1.5em\"><strong>Use AI to sell smarter.</strong> Experiment with AI, n8n and modern sales technology to research accounts, understand buyers, personalise outreach and improve how you work. You don’t need to be an engineer - but you should be curious about technology and excited to learn.</p><p style=\"min-height:1.5em\"></p><h2><strong>What you’ll do;</strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Build enterprise pipeline:</strong> Prospect into a focused set of strategic accounts and create qualified opportunities.</p></li><li><p style=\"min-height:1.5em\"><strong>Develop account strategies:</strong> Partner with Enterprise AEs to identify priority companies, stakeholders, challenges, use cases and engagement strategies.</p></li><li><p style=\"min-height:1.5em\"><strong>Research your prospects:</strong> Understand the business and technical priorities of stakeholders across IT, DevOps, SecOps, Engineering and related teams.</p></li><li><p style=\"min-height:1.5em\"><strong>Create outreach that gets attention:</strong> Develop thoughtful, personalised messaging tied to real account priorities rather than generic sequences.</p></li><li><p style=\"min-height:1.5em\"><strong>Prospect across channels:</strong> Engage prospects through email, phone, LinkedIn and other relevant channels.</p></li><li><p style=\"min-height:1.5em\"><strong>Lead early-stage discovery:</strong> Understand business needs, technical environments, priorities, urgency and potential fit with n8n.</p></li><li><p style=\"min-height:1.5em\"><strong>Continuously improve:</strong> Use Salesforce, Outreach, Apollo, AI tools, coaching and performance data to sharpen your approach.</p></li></ul><p style=\"min-height:1.5em\"></p><h2><strong>What we’re looking for;</strong></h2><p style=\"min-height:1.5em\">We’re looking for someone with a strong SDR foundation who wants to develop into an excellent enterprise seller.</p><p style=\"min-height:1.5em\">You’ll likely be a good fit if you have:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\">SDR or BDR experience in B2B SaaS, software or technology</p></li><li><p style=\"min-height:1.5em\">Experience generating pipeline through outbound prospecting within mid- market or enterprise accounts</p></li><li><p style=\"min-height:1.5em\">A strong sales track record against your targets</p></li><li><p style=\"min-height:1.5em\">Fluency in English (verbal and written) + fluent/bilingual (C1) French is beneficial</p></li><li><p style=\"min-height:1.5em\">Confidence engaging senior business and technical stakeholders</p></li><li><p style=\"min-height:1.5em\">A thoughtful approach to account research, personalisation and qualification</p></li><li><p style=\"min-height:1.5em\">Curiosity about technical products, automation and AI</p></li><li><p style=\"min-height:1.5em\">Resilience, consistency and ownership of your results</p></li><li><p style=\"min-height:1.5em\">The ability to work from our <strong>London office three days per week</strong></p></li></ul><p style=\"min-height:1.5em\"><strong>Bonus points if you have:</strong> experience prospecting into technical audiences; familiarity with buying committees, Salesforce, Outreach, Apollo or MEDDPICC; experience using AI or automation in your own sales workflow.</p><p style=\"min-height:1.5em\"></p><h2><strong>What success looks like</strong></h2><p style=\"min-height:1.5em\">Success here is about <strong>quality, not just activity</strong>.</p><p style=\"min-height:1.5em\">You’ll build a deep understanding of your accounts, identify the right stakeholders, create messaging that earns attention and generate qualified enterprise opportunities that can turn into meaningful revenue.</p><p style=\"min-height:1.5em\">Along the way, you’ll build experience in <strong>enterprise account strategy, technical selling, discovery, AI and automation, and complex B2B sales</strong> - giving you a strong foundation for the next stage of your career.</p><p style=\"min-height:1.5em\"></p><h2><strong>Interested?</strong></h2><p style=\"min-height:1.5em\">You don’t need to meet every requirement to apply.</p><p style=\"min-height:1.5em\">If you have a strong foundation in outbound sales, you’re curious about technology, and you’re excited by the opportunity to help build n8n’s enterprise business while developing towards your next step in sales, <strong>we’d love to hear from you.</strong></p><p style=\"min-height:1.5em\"><em>n8n is an equal opportunity employer and does not discriminate on the basis of race, religion, colour, national origin, gender, sexual orientation, gender identity, age, marital status, veteran status, or disability status.</em></p><p style=\"min-height:1.5em\"><em>We can sponsor visas to Germany; for any other country, you need to have existing right to work.</em></p><p style=\"min-height:1.5em\"><em><strong>Our company language is English.</strong></em></p><p style=\"min-height:1.5em\"><em>You care about diversity and inclusion? We do too! Check out our </em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/Diversity-inclusion-and-belonging-n8n-c1bec2fff536422d868b1a438d990e35?pvs=21\"><em>Diversity, Inclusion and Belonging initiatives at n8n</em></a><em> (</em><a target=\"_blank\" rel=\"noopener noreferrer nofollow\" href=\"https://www.notion.so/n8n/Diversity-inclusion-and-belonging-n8n-c1bec2fff536422d868b1a438d990e35\"><em>https://www.notion.so/n8n/Diversity-inclusion-and-belonging-n8n-c1bec2fff536422d868b1a438d990e35</em></a><em>).</em></p><h2></h2><p style=\"min-height:1.5em\"><em><strong>Location disclaimer:</strong> If you see multiple job postings for the same role, it is most likely because we're hiring remotely for this role and posting in different locations to make sure every potential candidate can see the role. Please apply to the location you're the most likely to work from in the future. </em></p><p style=\"min-height:1.5em\"></p><h2><strong>Benefits </strong></h2><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Competitive compensation</strong> 💸 – We offer fair and attractive pay.</p></li><li><p style=\"min-height:1.5em\"><strong>Ownership</strong> 💪 – Our core value is to “empower others,” and we mean it—you’ll get a slice of n8n with equity.</p></li><li><p style=\"min-height:1.5em\"><strong>Work/life balance</strong> 🏖️ – We work hard but ensure you have time to recharge:</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Europe:</strong> 30 days of vacation, plus public holidays wherever you are.</p></li><li><p style=\"min-height:1.5em\"><strong>US:</strong> 20 vacation days, 8 sick days, plus public holidays wherever you are.</p></li></ul></li><li><p style=\"min-height:1.5em\"><strong>Health &amp; wellness</strong> 🩺 –</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Europe:</strong> We provide benefits according to local country norms.*</p></li><li><p style=\"min-height:1.5em\"><strong>US</strong>: Multiple low-premium, low-deductible medical plans with coverage for individuals and families—plus a no-cost premium HDHP option with a pre-seeded HSA—along with dental and vision coverage.</p></li></ul></li><li><p style=\"min-height:1.5em\"><strong>Future planning</strong> 💰 –</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Europe:</strong> We provide pension contributions according to local country norms.*</p></li><li><p style=\"min-height:1.5em\"><strong>US:</strong> 401(k) retirement plan with a 4% employer match.</p></li></ul></li><li><p style=\"min-height:1.5em\"><strong>Financial security</strong> 🛡️ –</p><ul style=\"min-height:1.5em\"><li><p style=\"min-height:1.5em\"><strong>Europe:</strong> We provide benefits according to local country norms.*</p></li><li><p style=\"min-height:1.5em\"><strong>US: </strong>Company-paid short-term and long-term disability insurance, plus life insurance to support you and your loved ones.</p></li></ul></li><li><p style=\"min-height:1.5em\"><strong>Career growth</strong> 📈 – We hire rising stars who grow with us! You’ll get €1K (or equivalent) per year to spend on courses, books, events, or coaching to level up your skills.</p></li><li><p style=\"min-height:1.5em\"><strong>A passionate team</strong> 🤩 – We love our product, and we prove it with regular hackathons where we see who can build the coolest thing with it!</p></li><li><p style=\"min-height:1.5em\"><strong>Remote-first</strong> 🌏 – Our team works remotely across Europe, with regular off-sites for team bonding. Some roles, like sales in the US, are hybrid—please check the job description.</p></li><li><p style=\"min-height:1.5em\"><strong>Giving back</strong> 🤝 – We're big fans of open source, and you'll get $100 per month to support projects you care about.</p></li><li><p style=\"min-height:1.5em\"><strong>Transparency</strong> 🙏 – We all know what everyone’s working on, how the company is doing—the whole shebang.</p></li></ul><p style=\"min-height:1.5em\"><em>*Country and/or State specific details provided in your employment agreement.</em></p>","directApply":true,"identifier":{"@type":"PropertyValue","name":"n8n","value":"b2a33331-6fa0-4e79-8ce2-7979be7702df"},"datePosted":"2026-11-02","hiringOrganization":{"@type":"Organization","name":"n8n",
