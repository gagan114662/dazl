  <meta name="description" content="WHY MINTLIFY?

We&#39;re on a mission to empower builders. 

 - Massive reach: Our docs platform serves 100 million+ developers every year and powers documentation for 20,000+ companies, including Anthropic, Microsoft, PayPal, Spotify, Coinbase, X, and over 20% of the last YC batch.

 - Small team, huge impact: We recently passed 65 employees and raised a $45 million Series B led by A16Z and Salesforce Ventures. Each new hire has a huge impact on shaping the company&#39;s trajectory. 

 - Culture of slope over y-intercept https://mattrickard.com/hire-slope-not-intercept: We value learning velocity, grit, and unapologetically unique personalities.

We grew in value faster than headcount and we’re looking to align the two quickly.


WHAT YOU&#39;LL WORK ON HERE

You&#39;ll own targeted outbound into either Mid-Market or Enterprise and Strategic accounts. You&#39;ll research each account, find the right Director+ technical buyers, and reach them by email, phone, and LinkedIn. Your goal is booking meetings that our AEs turn into qualified opportunities.

 - Research: Dig into an account before you reach out: their docs, their developer platform, how well AI agents can read their docs today, and who owns them.

 - Outreach: Write messages that speak credibly to Director+ technical buyers. Personalize every touch to the account and the person.

 - Calling: Calls are part of the mix, alongside email and LinkedIn. You&#39;re calling people you&#39;ve researched, not dialing down a list all day.

 - Events: Invite the right prospects to AE-hosted dinners and events, and make sure they show up.



WHAT YOU BRING TO THE TABLE

 - Incredibly fast learner - either with experience prospecting into engineering teams, or an ability to learn quickly

 - Curiosity and the drive to show up, ask questions, work hard, and ride the highs and the lows. Absolutely non-negotiable

 - Willingness to leverage AI powered technology to create efficiencies in your day to day cadence

 - Ability to communicate credibly with technical buyers. You can hold a conversation with a Director or VP of Engineering about developer experience, documentation workflows, API strategy, and how AI agents read docs, without sounding like you&#39;re reading a script

 - Strong written communication. Outreach reads like it was written by a thoughtful person, not a sequence tool. You personalize every touch for critical personas and accounts

 - Research depth. You can look at an account and quickly understand why they&#39;re a fit, who the right contacts are, and what pain to lead with.

 - Organizational discipline. CRM hygiene, clean handoff notes, systematic follow-up. You don&#39;t let things fall through the cracks.

 - Appropriate Persistence. You know the difference between following up and spamming.

 - Salesforce proficiency, outbound tooling including Nooks, Lemlist, LinkedIn Sales Navigator, and others.



BONUS POINTS:

 - Prior SDR/BDR experience in B2B SaaS - particularly having sold to technical buyers or developer-focused companies

 - Experience with event-based or dinner-based sales motions

 - Background at a PLG or developer-tools company (you understand how product-led and sales-led motions coexist)


WHY YOU SHOULD JOIN OUR SALES TEAM


You&#39;ll be joining a company where the product sells itself to developers. Your job is instrumental in helping us bring Mintlify to the enterprise buyers who can deploy it at scale. The product-market fit is real. What we&#39;re building now is the sales motion to match.
This is a ground-floor opportunity to build something. You won&#39;t be plugging into a mature SDR org with a playbook someone else wrote. You&#39;ll be writing the playbook and we&#39;ll be here to help you nail it.

Your path to AE
We hire SDRs to grow into AEs. You&#39;ll learn how enterprise deals get built from the first touch, and as you prove yourself, you&#39;ll move toward running deals of your own.


COMPANY BENEFITS:

 - Competitive compensation and equity

 - 20 days paid time off every year

 - 401k with Employer Match

 - $250 monthly wellness stipend

 - 100% employee coverage for Health, Dental, Vision

 - Commute stipend to help get you to and from work

 - Free lunch and dinners

 - Annual team offsite (previously went to Alaska, Hawaii, Jackson Hole)" />
