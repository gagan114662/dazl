name: release-preflight
on:
  pull_request:
    paths: ['web/**', 'ops/**', 'session-worker/**', '.github/workflows/web-ci.yml', '.github/workflows/release-gate.yml', '.github/workflows/release-preflight.yml', '.github/workflows/session-worker-ci.yml']
  push:
    branches: [main]
    paths: ['web/**', 'ops/**', 'session-worker/**', '.github/workflows/web-ci.yml', '.github/workflows/release-gate.yml', '.github/workflows/release-preflight.yml', '.github/workflows/session-worker-ci.yml']
  # Same exact-SHA coverage as web-ci: dispatchable at any ref.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-preflight-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # #901: the discovery guard runs on its own, BEFORE discovery and independent of any discovery pattern, so changing a
      # pattern below can never switch the guard off. It fails if any ops/**/test*.py file is outside the discovery steps.
      - name: Ops test discovery guard
        run: python3 ops/test_ci_discovery.py
      - name: Ops tests (ops/test_*.py)
        run: python3 -m unittest discover -s ops -p 'test_*.py'
      # ops/staging has no __init__.py, so discovery over ops never reaches it (#907/#908 tests): its own step.
      - name: Ops staging tests (ops/staging/test_*.py)
        run: python3 -m unittest discover -s ops/staging -p 'test_*.py'
      # ops/prod (the production deploy from a prebuilt build, #907) has no __init__.py either: its own step.
      - name: Ops prod tests (ops/prod/test_*.py)
        run: python3 -m unittest discover -s ops/prod -p 'test_*.py'
