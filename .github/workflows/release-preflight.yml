name: release-preflight
on:
  pull_request:
    paths: ['web/**', 'ops/**', 'session-worker/**', '.github/workflows/web-ci.yml', '.github/workflows/release-gate.yml', '.github/workflows/release-preflight.yml', '.github/workflows/session-worker-ci.yml']
  push:
    branches: [main]
    paths: ['web/**', 'ops/**', 'session-worker/**', '.github/workflows/web-ci.yml', '.github/workflows/release-gate.yml', '.github/workflows/release-preflight.yml', '.github/workflows/session-worker-ci.yml']
  # Same exact-SHA coverage as web-ci: dispatchable at any ref.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-preflight-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fail-closed:
    runs-on: [self-hosted, Linux, X64, dazl-ci]
    container:
      image: ubuntu:24.04
      options: --cpus 4 --memory 6g --memory-swap 6g --pids-limit 2048 --shm-size 1g --umask 0022
    env:
      NPM_CONFIG_CACHE: /tmp/ci-npm-cache
    defaults:
      run:
        shell: /usr/local/bin/ci-bash {0}
    steps:
      - name: Isolated job prerequisites
        shell: bash
        working-directory: /
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl git tar gzip xz-utils unzip python3 python3-yaml build-essential sudo sqlite3 rsync age passwd
      - uses: actions/checkout@v4
      # #901: the discovery guard runs on its own, BEFORE discovery and independent of any discovery pattern, so changing a
      # pattern below can never switch the guard off. It fails if any ops/**/test*.py file is outside the discovery steps.
      - name: Install non-root CI command shell
        shell: bash
        working-directory: /
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-container-bootstrap.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preflight real browser prerequisite
        shell: bash
        working-directory: /
        run: |
          curl -fsSL https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -o "$RUNNER_TEMP/google-chrome.deb"
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "$RUNNER_TEMP/google-chrome.deb"
          google-chrome --version
      - name: Ops test discovery guard
        run: python3 ops/test_ci_discovery.py
      - name: Ops tests (ops/test_*.py)
        run: python3 -m unittest discover -s ops -p 'test_*.py'
      # ops/staging has no __init__.py, so discovery over ops never reaches it (#907/#908 tests): its own step.
      - name: Ops staging tests (ops/staging/test_*.py)
        run: python3 -m unittest discover -s ops/staging -p 'test_*.py'
      # ops/prod (the production deploy from a prebuilt build, #907) has no __init__.py either: its own step.
      - name: Ops prod tests (ops/prod/test_*.py)
        run: python3 -m unittest discover -s ops/prod -p 'test_*.py'
      # ops/session-worker (the session worker's unit and install script, #1037) has no __init__.py either: its own step. It boots the
      # worker from session-worker/ at the checked-out commit, so Node 22 is needed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ops session-worker tests (ops/session-worker/test_*.py)
        run: python3 -m unittest discover -s ops/session-worker -p 'test_*.py'
      # ops/inbound-mail (the AWS-only inbound mail receiver, #1111) is not a package either: its own step. aiosmtpd is
      # the one dependency, installed from the same Ubuntu package the box runs, so the SMTP-level tests are not skipped.
      - name: Inbound mail receiver tests (ops/inbound-mail/test_*.py)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-aiosmtpd
          /usr/bin/python3 -c 'import aiosmtpd'
          /usr/bin/python3 -m unittest discover -s ops/inbound-mail -p 'test_*.py' -v
