name: release-preflight
on:
  pull_request:
    paths: ['web/**', 'ops/**', 'session-worker/**', '.github/workflows/web-ci.yml', '.github/workflows/release-gate.yml', '.github/workflows/release-preflight.yml', '.github/workflows/session-worker-ci.yml']
  push:
    branches: [main]
    paths: ['web/**', 'ops/**', 'session-worker/**', '.github/workflows/web-ci.yml', '.github/workflows/release-gate.yml', '.github/workflows/release-preflight.yml', '.github/workflows/session-worker-ci.yml']
  # Same exact-SHA coverage as web-ci: dispatchable at any ref.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-preflight-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every ops/test_*.py file runs here; ops/test_ci_discovery.py fails if a
      # test file would fall outside this pattern (e.g. backup preflight, #901).
      - run: python3 -m unittest discover -s ops -p 'test_*.py'
