name: release-preflight
on:
  pull_request:
    paths: ['web/**', 'ops/**', '.github/workflows/release-preflight.yml']
  push:
    branches: [main]
    paths: ['web/**', 'ops/**', '.github/workflows/release-preflight.yml']
permissions:
  contents: read
jobs:
  fail-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s ops -p 'test_*launch*.py'
