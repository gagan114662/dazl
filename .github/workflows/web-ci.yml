name: web-ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
    # no path filter on main: every merged commit gets the full suite and, if green, main-green (gate 3)
  # Manual runs on main can still validate the selected commit.
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  # PRs cancel stale runs. Main pushes share a group so the active run finishes
  # and GitHub replaces older pending runs with the newest one.
  group: ${{ github.event_name == 'push' && 'web-ci-main' || format('web-ci-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  fast-pr:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.PR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify PR merge parents
        id: pr_base
        working-directory: .
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(node .github/scripts/pr-merge-base.mjs "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_EVENT_BASE_SHA")
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Lint changed files and typecheck the full web project
        env:
          PR_BASE_SHA: ${{ steps.pr_base.outputs.sha }}
        run: |
          set -euo pipefail
          git diff --relative --name-only -z "$PR_BASE_SHA...$GITHUB_SHA" -- '*.ts' '*.tsx' '*.mts' '*.mjs' > "$RUNNER_TEMP/changed-web-files"
          mapfile -d '' -t changed < "$RUNNER_TEMP/changed-web-files"
          files=()
          for f in "${changed[@]}"; do
            if [[ -f "$f" ]]; then files+=("$f"); fi
          done
          if (( ${#files[@]} )); then npx eslint -- "${files[@]}"; fi
          npm run check:unused
      - name: Run affected unit tests
        if: "!contains(github.event.pull_request.labels.*.name, 'ready-to-merge') && !contains(github.event.pull_request.labels.*.name, 'quest-approved')"
        env:
          PR_BASE_SHA: ${{ steps.pr_base.outputs.sha }}
        run: |
          set -euo pipefail
          selected=$(cd .. && node .github/scripts/affected-tests.mjs "$PR_BASE_SHA" "$GITHUB_SHA")
          if [ -z "$selected" ]; then echo "::error::Missing affected test selection"; exit 1; fi
          if [ "$selected" = ALL ]; then
            echo "Shared changes require the full tier. Running explicitly changed tests now." >> "$GITHUB_STEP_SUMMARY"
            selected=$(git diff --name-only --diff-filter=AM "$PR_BASE_SHA...$GITHUB_SHA" -- test/ |
              sed 's#^web/##' | sed -nE '/^test\/[a-zA-Z0-9_.-]+\.test\.(ts|mjs)$/p' | paste -sd ' ' -)
          fi
          if [ -z "$selected" ] || [ "$selected" = NONE ]; then echo "No affected unit tests selected."; exit 0; fi
          read -r -a files <<< "$selected"
          runnable=()
          for f in "${files[@]}"; do
            [[ "$f" =~ ^test/[a-zA-Z0-9_.-]+\.test\.(ts|mjs)$ ]] || { echo "::error::Invalid test selection"; exit 1; }
            if [[ -f "$f" ]]; then runnable+=("$f"); fi
          done
          if (( ${#runnable[@]} )); then
            SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 node --experimental-strip-types --import ./test/helpers/net-fence.ts --test "${runnable[@]}"
          fi
  # Full suite on SQLite, today's runtime store. PG-only tests skip here.
  # Sharded 4 ways (round-robin over the exact `npm test` file list) so the full suite on
  # main can run the work concurrently. Every file still runs in exactly one shard; the test-sqlite and
  # test-postgres jobs below keep the required check names and fail unless every shard passed.
  sqlite-shard:
    if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || contains(github.event.pull_request.labels.*.name, 'ready-to-merge') || contains(github.event.pull_request.labels.*.name, 'quest-approved') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ github.event_name == 'pull_request' && vars.PR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Full-repo typecheck on non-PR events
        if: matrix.shard == 1 && github.event_name != 'pull_request'
        run: npm run check:unused
      # age for the encrypted off-host backup tests (test/offhost-backup.test.ts); DAZL_REQUIRE_AGE makes a missing one fail
      - run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Full test suite
        env:
          DAZL_REQUIRE_AGE: "1"
          SEL: ALL
        run: |
          # the full list is exactly what `npm test` runs; the guard fails loudly if package.json's test script changes
          want='SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 node --experimental-strip-types --import ./test/helpers/net-fence.ts --test test/*.test.ts test/crm-webhook-unknown-ui.test.mjs'
          [ "$(node -p 'require("./package.json").scripts.test')" = "$want" ] || { echo "::error::web/package.json test script changed: update the shard list in web-ci.yml"; exit 1; }
          if [ "${{ github.event_name }}" != pull_request ] || [ "$SEL" = ALL ]; then all=$(ls test/*.test.ts test/crm-webhook-unknown-ui.test.mjs)
          elif [ "$SEL" = NONE ]; then echo "no affected tests"; exit 0
          else all=$SEL
          fi
          set -f
          files=()
          for f in $all; do
            [[ "$f" =~ ^test/[a-zA-Z0-9_.-]+\.test\.(ts|mjs)$ && -f "$f" ]] || { echo "::error::Invalid test selection entry"; exit 1; }
            files+=("$f")
          done
          (( ${#files[@]} > 0 )) || { echo "::error::Missing test selection (NONE must be explicit)"; exit 1; }
          selected=$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)
          [[ $(printf '%s\n' "$selected" | uniq | wc -l) -eq ${#files[@]} ]] || { echo "::error::Duplicate test selection"; exit 1; }
          mapfile -t mine < <(printf '%s\n' "$selected" | awk -v n=4 -v i=${{ matrix.shard }} 'NF && (NR-1)%n==i-1')
          echo "shard ${{ matrix.shard }}/4: ${#mine[@]} of ${#files[@]} files"
          if (( ${#mine[@]} > 0 )); then
            SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 node --experimental-strip-types --import ./test/helpers/net-fence.ts --test "${mine[@]}"
          fi

  # Full suite again with a Postgres 16 service container. Tests that take DAZL_TEST_PG_URL run against it (data layer
  # contract, migrations, schema drift) and DAZL_REQUIRE_PG=1 makes them fail instead of skipping if it is missing.
  # Modules not yet moved to lib/db/client.ts still run on SQLite in this job (docs/PLATFORM.md step 2).
  postgres-shard:
    if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || contains(github.event.pull_request.labels.*.name, 'ready-to-merge') || contains(github.event.pull_request.labels.*.name, 'quest-approved') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ github.event_name == 'pull_request' && vars.PR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DAZL_TEST_PG_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      DAZL_REQUIRE_PG: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Full test suite
        env:
          SEL: ALL
        run: |
          # the full list is exactly what `npm test` runs; the guard fails loudly if package.json's test script changes
          want='SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 node --experimental-strip-types --import ./test/helpers/net-fence.ts --test test/*.test.ts test/crm-webhook-unknown-ui.test.mjs'
          [ "$(node -p 'require("./package.json").scripts.test')" = "$want" ] || { echo "::error::web/package.json test script changed: update the shard list in web-ci.yml"; exit 1; }
          if [ "${{ github.event_name }}" != pull_request ] || [ "$SEL" = ALL ]; then all=$(ls test/*.test.ts test/crm-webhook-unknown-ui.test.mjs)
          elif [ "$SEL" = NONE ]; then echo "no affected tests"; exit 0
          else all=$SEL
          fi
          set -f
          files=()
          for f in $all; do
            [[ "$f" =~ ^test/[a-zA-Z0-9_.-]+\.test\.(ts|mjs)$ && -f "$f" ]] || { echo "::error::Invalid test selection entry"; exit 1; }
            files+=("$f")
          done
          (( ${#files[@]} > 0 )) || { echo "::error::Missing test selection (NONE must be explicit)"; exit 1; }
          selected=$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)
          [[ $(printf '%s\n' "$selected" | uniq | wc -l) -eq ${#files[@]} ]] || { echo "::error::Duplicate test selection"; exit 1; }
          mapfile -t mine < <(printf '%s\n' "$selected" | awk -v n=4 -v i=${{ matrix.shard }} 'NF && (NR-1)%n==i-1')
          echo "shard ${{ matrix.shard }}/4: ${#mine[@]} of ${#files[@]} files"
          if (( ${#mine[@]} > 0 )); then
            SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 node --experimental-strip-types --import ./test/helpers/net-fence.ts --test "${mine[@]}"
          fi
      - name: db:migrate against the service container, twice (second run must apply nothing)
        if: matrix.shard == 1
        run: |
          DATABASE_URL=$DAZL_TEST_PG_URL npm run db:migrate
          DATABASE_URL=$DAZL_TEST_PG_URL npm run db:migrate | grep -q 'applied \[\]'
      - name: live leads-read contract on the regenerated schema
        if: matrix.shard == 1
        run: DAZL_PG_ADMIN=$DAZL_TEST_PG_URL node --experimental-strip-types --test test/leads-read-pg-live.test.ts

  # Required check names are stable. A full run must pass every shard, and a PR must pass the fast checks.
  test-sqlite:
    if: always()
    needs: [fast-pr, sqlite-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FULL_CI: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || contains(github.event.pull_request.labels.*.name, 'ready-to-merge') || contains(github.event.pull_request.labels.*.name, 'quest-approved') }}
      EVENT: ${{ github.event_name }}
      FAST: ${{ needs.fast-pr.result }}
      SHARDS: ${{ needs.sqlite-shard.result }}
    steps:
      - working-directory: .
        run: |
          if [ "$EVENT" = pull_request ] && [ "$FAST" != success ]; then
            echo "::error::Fast PR checks: $FAST"
            exit 1
          fi
          if [ "$FULL_CI" = false ] && [ "$SHARDS" = skipped ]; then
            message="full suite deferred until ready-to-merge"
            printf '%s\n' "$message"
            printf '%s\n' "$message" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          [ "$FULL_CI" = true ] && [ "$SHARDS" = success ] || { echo "::error::Shards: $SHARDS"; exit 1; }

  test-postgres:
    if: always()
    needs: [fast-pr, postgres-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FULL_CI: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || contains(github.event.pull_request.labels.*.name, 'ready-to-merge') || contains(github.event.pull_request.labels.*.name, 'quest-approved') }}
      EVENT: ${{ github.event_name }}
      FAST: ${{ needs.fast-pr.result }}
      SHARDS: ${{ needs.postgres-shard.result }}
    steps:
      - working-directory: .
        run: |
          if [ "$EVENT" = pull_request ] && [ "$FAST" != success ]; then
            echo "::error::Fast PR checks: $FAST"
            exit 1
          fi
          if [ "$FULL_CI" = false ] && [ "$SHARDS" = skipped ]; then
            message="full suite deferred until ready-to-merge"
            printf '%s\n' "$message"
            printf '%s\n' "$message" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 0
          fi
          [ "$FULL_CI" = true ] && [ "$SHARDS" = success ] || { echo "::error::Shards: $SHARDS"; exit 1; }

  # Required on main's branch protection to prevent merging after just the fast tier.
  full-suite:
    if: always()
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FULL_CI: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || contains(github.event.pull_request.labels.*.name, 'ready-to-merge') || contains(github.event.pull_request.labels.*.name, 'quest-approved') }}
      SQLITE: ${{ needs.test-sqlite.result }}
      POSTGRES: ${{ needs.test-postgres.result }}
    steps:
      - name: Require the full tier and passing shards
        run: |
          if [ "$FULL_CI" != true ]; then
            echo "::error::Add ready-to-merge or quest-approved to run the full suite before merging."
            exit 1
          fi
          if [ "$SQLITE" != success ] || [ "$POSTGRES" != success ]; then
            echo "::error::Full suite requires successful SQLite and PostgreSQL checks."
            exit 1
          fi
          echo "Full SQLite and PostgreSQL checks passed."

  # Gate 3: after the full suite passes on main, mark the commit green. Only main-green commits may deploy (prod-deploy.yml).
  main-green:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Mark main-green (commit status + moving tag)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=main-green -f description="full suite passed post-merge"
          gh api "repos/$REPO/git/refs/tags/main-green" -X PATCH -f sha="$SHA" -F force=true \
            || gh api "repos/$REPO/git/refs" -f ref=refs/tags/main-green -f sha="$SHA"

  # Gate 2: say clearly when a PR job hit the 20-minute budget, so an optimization lane gets opened.
  pr-budget:
    if: always() && github.event_name == 'pull_request'
    needs: [fast-pr, sqlite-shard, postgres-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Budget report
        env:
          FAST: ${{ needs.fast-pr.result }}
          R1: ${{ needs.sqlite-shard.result }}
          R2: ${{ needs.postgres-shard.result }}
        run: |
          echo "fast-pr=$FAST test-sqlite=$R1 test-postgres=$R2"
          if [ "$FAST" = cancelled ] || [ "$R1" = cancelled ] || [ "$R2" = cancelled ]; then
            echo "::error::PR CI over the 20-minute budget (job cancelled by timeout). Open an optimization lane."
            exit 1
          fi
