name: web-ci
on:
  pull_request:
    paths: ["web/**", "ops/**", "session-worker/**", ".github/workflows/web-ci.yml", ".github/workflows/release-gate.yml", ".github/workflows/release-preflight.yml", ".github/workflows/session-worker-ci.yml"]
  push:
    branches: [main]
    paths: ["web/**", "ops/**", "session-worker/**", ".github/workflows/web-ci.yml", ".github/workflows/release-gate.yml", ".github/workflows/release-preflight.yml", ".github/workflows/session-worker-ci.yml"]
  # Manual run at an exact ref so a merged commit whose diff only touched release plumbing
  # can still carry the full required check set on its own SHA (checked_launch's gate).
  workflow_dispatch:
jobs:
  # Full suite on SQLite, today's runtime store. PG-only tests skip here.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DAZL_TEST_PG_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      DAZL_REQUIRE_PG: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: credit-pool PG tests only (throwaway proof)
        run: SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 node --experimental-strip-types --import ./test/helpers/net-fence.ts --test test/enrich-credit-pool.test.ts test/credit-pool-lifecycle.test.ts
