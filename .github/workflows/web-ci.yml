name: deploy-access-smoke-only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ziggy-deploy-access-smoke
  cancel-in-progress: false
jobs:
  restricted-deploy-credential-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
      PROD_DEPLOY_CMD: ${{ secrets.PROD_DEPLOY_CMD }}
    steps:
      - name: Read-only restricted deployment access and refusal controls
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess,tempfile,urllib.request
          names=['PROD_SSH_KEY','PROD_HOST','PROD_USER','PROD_KNOWN_HOSTS','PROD_DEPLOY_CMD']
          assert all(os.environ.get(n) for n in names),'Missing repository deploy secret'
          assert os.environ['PROD_DEPLOY_CMD']=='sudo /usr/local/lib/dazl-prod/deploy-prod.sh'
          def health():
           with urllib.request.urlopen('https://dazl.ai/api/health',timeout=10) as r:return json.load(r)
          before=health()
          with tempfile.TemporaryDirectory(prefix='dazl-deploy-smoke-',dir=os.environ['RUNNER_TEMP']) as folder:
           root=pathlib.Path(folder);key=root/'key';known=root/'known_hosts'
           key.write_text(os.environ['PROD_SSH_KEY'].rstrip()+'\n');known.write_text(os.environ['PROD_KNOWN_HOSTS'].rstrip()+'\n')
           key.chmod(0o600);known.chmod(0o600)
           ssh=['ssh','-F','/dev/null','-T','-i',str(key),'-o','IdentitiesOnly=yes','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o','UserKnownHostsFile='+str(known),'-o','ConnectTimeout=10','-o','ServerAliveInterval=5','-o','ServerAliveCountMax=1','--',os.environ['PROD_USER']+'@'+os.environ['PROD_HOST']]
           def call(command):return subprocess.run(ssh+[command],capture_output=True,text=True,timeout=25)
           status=call('--status');assert status.returncode==0,'New repository key cannot reach restricted deployment status'
           assert 'live port' in status.stdout and before['commit'] in status.stdout
           denied=call('id');assert denied.returncode==64 and 'command refused' in denied.stderr,'Arbitrary shell was not refused'
           invalid=call(os.environ['PROD_DEPLOY_CMD']+' not-a-sha');assert invalid.returncode!=0,'Malformed deployment SHA accepted'
          after=health();assert (before['commit'],before['instance'])==(after['commit'],after['instance']),'Public production identity changed during read-only smoke'
          print(json.dumps({'credential_smoke':'PASS','github_repository_secrets_consumed':True,'host_key_pinned':True,'restricted_status_allowed':True,'arbitrary_shell_refused':True,'malformed_deployment_refused':True,'production_unchanged':after['commit'],'deployment_performed':False,'feature_acceptance':'NOT TESTED'}))
          PY
