name: web-ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths: ["web/**", "ops/**", "session-worker/**", ".github/workflows/web-ci.yml", ".github/workflows/release-gate.yml", ".github/workflows/release-preflight.yml", ".github/workflows/session-worker-ci.yml"]
  push:
    branches: [main]
    # no path filter on main: every merged commit gets the full suite and, if green, main-green (gate 3)
  # Manual run at an exact ref so a merged commit whose diff only touched release plumbing
  # can still carry the full required check set on its own SHA (checked_launch's gate).
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  # PRs cancel stale runs. Main pushes share a group so the active run finishes
  # and GitHub replaces older pending runs with the newest one.
  group: ${{ github.event_name == 'push' && 'web-ci-main' || format('web-ci-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Full suite on SQLite, today's runtime store. PG-only tests skip here.
  # Sharded 4 ways (round-robin over the exact `npm test` file list, or over the PR's affected list) so the full suite on
  # main can run the work concurrently. Every file still runs in exactly one shard; the test-sqlite and
  # test-postgres jobs below keep the required check names and fail unless every shard passed.
  sqlite-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER || 'ubuntu-latest' }}
    # PC lane only (docs/CI-PC.md): a disposable rootless job container; '' = no container (GitHub-hosted).
    container: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER == 'dazl-ci' && fromJSON('{"image":"ubuntu:24.04","options":"--cpus 4 --memory 6g --memory-swap 6g --pids-limit 2048 --shm-size 1g --umask 0022"}') || '' }}
    # Gate 2: PRs get a hard 20-minute budget (affected tests only; 5 minutes cancelled most pull requests that touch a shared file, 2026-11-23); main runs the full suite (gate 3).
    # A reviewer-applied `full-suite-ci` label gives a PR the 45-minute ceiling AND forces ALL (#1099/#1273, Hermes F1).
    timeout-minutes: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-suite-ci') && 20 || 45 }}
    defaults:
      run:
        shell: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER == 'dazl-ci' && 'ci-bash {0}' || 'bash -e {0}' }}
        working-directory: web
    steps:
      - name: PC lane job prerequisites
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER == 'dazl-ci' }}
        shell: bash
        working-directory: /
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl git tar gzip xz-utils unzip python3 python3-yaml build-essential sudo age sqlite3 rsync passwd
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PC lane non-root command shell
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER == 'dazl-ci' }}
        shell: bash
        working-directory: /
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-container-bootstrap.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify PR merge parents
        if: github.event_name == 'pull_request'
        id: pr_base
        working-directory: .
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(node .github/scripts/pr-merge-base.mjs "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_EVENT_BASE_SHA")
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: npm ci
      # one tsc pass: ordinary type errors AND unused locals/imports/parameters (narrow documented exemptions, #898).
      # check-unused fails on any non-unused TS error too, so a separate `tsc --noEmit` step would only compile twice.
      # #1504: the full-repo type check runs on every PR too. Changed-file lint alone let an untouched file's type error
      # (TS6133 in a file the PR did not edit) reach main twice (#1462, #1480).
      - name: Lint changed files (PR) + full-repo typecheck (PR and main)
        if: matrix.shard == 1
        env:
          PR_BASE_SHA: ${{ steps.pr_base.outputs.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only "$PR_BASE_SHA...$GITHUB_SHA" -- 'web/*.ts' 'web/*.tsx' 'web/*.mts' 'web/*.mjs' | sed 's#^web/##' | while read -r f; do [ -f "$f" ] && echo "$f"; done)
            [ -z "$files" ] || npx eslint $files
          fi
          npm run check:unused
      # age for the encrypted off-host backup tests (test/offhost-backup.test.ts); DAZL_REQUIRE_AGE makes a missing one fail
      - run: sudo apt-get update -q && sudo apt-get install -y -q age
      - name: Affected tests (PR only; gate 2)
        id: sel
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          FULL_SUITE: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite-ci') }}
          PR_BASE_SHA: ${{ steps.pr_base.outputs.sha }}
        run: |
          if [ "$FULL_SUITE" = true ]; then sel=ALL; else sel=$(node .github/scripts/affected-tests.mjs "$PR_BASE_SHA" "$GITHUB_SHA"); fi
          echo "tests=$sel" >> "$GITHUB_OUTPUT"
          echo "affected: $sel"
      - name: Tests (PR = affected, main = full suite)
        env:
          DAZL_REQUIRE_AGE: "1"
          SEL: ${{ steps.sel.outputs.tests }}
        run: |
          # the full list is exactly what `npm test` runs; the guard fails loudly if package.json's test script changes
          want='SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 node --experimental-strip-types --import ./test/helpers/net-fence.ts --test test/*.test.ts test/crm-webhook-unknown-ui.test.mjs'
          [ "$(node -p 'require("./package.json").scripts.test')" = "$want" ] || { echo "::error::web/package.json test script changed: update the shard list in web-ci.yml"; exit 1; }
          if [ "${{ github.event_name }}" != pull_request ] || [ "$SEL" = ALL ]; then all=$(ls test/*.test.ts test/crm-webhook-unknown-ui.test.mjs)
          elif [ "$SEL" = NONE ]; then echo "no affected tests"; exit 0
          else all=$SEL
          fi
          set -f
          files=()
          for f in $all; do
            [[ "$f" =~ ^test/[a-zA-Z0-9_.-]+\.test\.(ts|mjs)$ && -f "$f" ]] || { echo "::error::Invalid test selection entry"; exit 1; }
            files+=("$f")
          done
          (( ${#files[@]} > 0 )) || { echo "::error::Missing test selection (NONE must be explicit)"; exit 1; }
          selected=$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)
          [[ $(printf '%s\n' "$selected" | uniq | wc -l) -eq ${#files[@]} ]] || { echo "::error::Duplicate test selection"; exit 1; }
          mapfile -t mine < <(printf '%s\n' "$selected" | awk -v n=4 -v i=${{ matrix.shard }} 'NF && (NR-1)%n==i-1')
          echo "shard ${{ matrix.shard }}/4: ${#mine[@]} of ${#files[@]} files"
          if (( ${#mine[@]} > 0 )); then
            SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 node --experimental-strip-types --import ./test/helpers/net-fence.ts --test "${mine[@]}"
          fi

  # Full suite again with a Postgres 16 service container. Tests that take DAZL_TEST_PG_URL run against it (data layer
  # contract, migrations, schema drift) and DAZL_REQUIRE_PG=1 makes them fail instead of skipping if it is missing.
  # Modules not yet moved to lib/db/client.ts still run on SQLite in this job (docs/PLATFORM.md step 2).
  postgres-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER || 'ubuntu-latest' }}
    # PC lane only (docs/CI-PC.md): a disposable rootless job container; '' = no container (GitHub-hosted).
    container: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER == 'dazl-ci' && fromJSON('{"image":"ubuntu:24.04","options":"--cpus 4 --memory 6g --memory-swap 6g --pids-limit 2048 --shm-size 1g --umask 0022"}') || '' }}
    timeout-minutes: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-suite-ci') && 20 || 45 }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        # PC lane: no published host port (all WSL distros share one network namespace); hosted keeps 5432:5432.
        ports: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER == 'dazl-ci' && fromJSON('[]') || fromJSON('["5432:5432"]') }}
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DAZL_TEST_PG_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      DAZL_REQUIRE_PG: "1"
    defaults:
      run:
        shell: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER == 'dazl-ci' && 'ci-bash {0}' || 'bash -e {0}' }}
        working-directory: web
    steps:
      - name: PC lane job prerequisites
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER == 'dazl-ci' }}
        shell: bash
        working-directory: /
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl git tar gzip xz-utils unzip python3 python3-yaml build-essential sudo age sqlite3 rsync passwd socat postgresql-client
      - name: PC lane private loopback PostgreSQL bridge (no published host port)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER == 'dazl-ci' }}
        shell: bash
        working-directory: /
        run: |
          socat TCP4-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP4:postgres:5432 >"$RUNNER_TEMP/postgres-proxy.log" 2>&1 &
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 -U postgres && break; sleep 1; done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PC lane non-root command shell
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.PR_CI_RUNNER == 'dazl-ci' }}
        shell: bash
        working-directory: /
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-container-bootstrap.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify PR merge parents
        if: github.event_name == 'pull_request'
        id: pr_base
        working-directory: .
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(node .github/scripts/pr-merge-base.mjs "$GITHUB_SHA" "$PR_HEAD_SHA" "$PR_EVENT_BASE_SHA")
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Affected tests (PR only; gate 2)
        id: sel
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          FULL_SUITE: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite-ci') }}
          PR_BASE_SHA: ${{ steps.pr_base.outputs.sha }}
        run: |
          if [ "$FULL_SUITE" = true ]; then sel=ALL; else sel=$(node .github/scripts/affected-tests.mjs "$PR_BASE_SHA" "$GITHUB_SHA"); fi
          echo "tests=$sel" >> "$GITHUB_OUTPUT"
          echo "affected: $sel"
      - name: Tests (PR = affected, main = full suite)
        env:
          SEL: ${{ steps.sel.outputs.tests }}
        run: |
          # the full list is exactly what `npm test` runs; the guard fails loudly if package.json's test script changes
          want='SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 node --experimental-strip-types --import ./test/helpers/net-fence.ts --test test/*.test.ts test/crm-webhook-unknown-ui.test.mjs'
          [ "$(node -p 'require("./package.json").scripts.test')" = "$want" ] || { echo "::error::web/package.json test script changed: update the shard list in web-ci.yml"; exit 1; }
          if [ "${{ github.event_name }}" != pull_request ] || [ "$SEL" = ALL ]; then all=$(ls test/*.test.ts test/crm-webhook-unknown-ui.test.mjs)
          elif [ "$SEL" = NONE ]; then echo "no affected tests"; exit 0
          else all=$SEL
          fi
          set -f
          files=()
          for f in $all; do
            [[ "$f" =~ ^test/[a-zA-Z0-9_.-]+\.test\.(ts|mjs)$ && -f "$f" ]] || { echo "::error::Invalid test selection entry"; exit 1; }
            files+=("$f")
          done
          (( ${#files[@]} > 0 )) || { echo "::error::Missing test selection (NONE must be explicit)"; exit 1; }
          selected=$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)
          [[ $(printf '%s\n' "$selected" | uniq | wc -l) -eq ${#files[@]} ]] || { echo "::error::Duplicate test selection"; exit 1; }
          mapfile -t mine < <(printf '%s\n' "$selected" | awk -v n=4 -v i=${{ matrix.shard }} 'NF && (NR-1)%n==i-1')
          echo "shard ${{ matrix.shard }}/4: ${#mine[@]} of ${#files[@]} files"
          if (( ${#mine[@]} > 0 )); then
            SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 node --experimental-strip-types --import ./test/helpers/net-fence.ts --test "${mine[@]}"
          fi
      - name: db:migrate against the service container, twice (second run must apply nothing)
        if: matrix.shard == 1
        run: |
          DATABASE_URL=$DAZL_TEST_PG_URL npm run db:migrate
          DATABASE_URL=$DAZL_TEST_PG_URL npm run db:migrate | grep -q 'applied \[\]'
      - name: live leads-read contract on the regenerated schema
        if: matrix.shard == 1
        run: DAZL_PG_ADMIN=$DAZL_TEST_PG_URL node --experimental-strip-types --test test/leads-read-pg-live.test.ts

  # Required checks: these names are what branch protection requires. Each passes only if every shard passed.
  test-sqlite:
    if: always()
    needs: sqlite-shard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: '[ "${{ needs.sqlite-shard.result }}" = success ] || { echo "::error::sqlite shards: ${{ needs.sqlite-shard.result }}"; exit 1; }'
  test-postgres:
    if: always()
    needs: postgres-shard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: '[ "${{ needs.postgres-shard.result }}" = success ] || { echo "::error::postgres shards: ${{ needs.postgres-shard.result }}"; exit 1; }'

  # Gate 3: after the full suite passes on main, mark the commit green. Only main-green commits may deploy (prod-deploy.yml).
  main-green:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test-sqlite, test-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Mark main-green (commit status + moving tag)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=main-green -f description="full suite passed post-merge"
          gh api "repos/$REPO/git/refs/tags/main-green" -X PATCH -f sha="$SHA" -F force=true \
            || gh api "repos/$REPO/git/refs" -f ref=refs/tags/main-green -f sha="$SHA"

  # Gate 2: say clearly when a PR job hit the 20-minute budget, so an optimization lane gets opened.
  pr-budget:
    if: always() && github.event_name == 'pull_request'
    needs: [sqlite-shard, postgres-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Budget report
        env:
          R1: ${{ needs.sqlite-shard.result }}
          R2: ${{ needs.postgres-shard.result }}
        run: |
          echo "test-sqlite=$R1 test-postgres=$R2"
          if [ "$R1" = cancelled ] || [ "$R2" = cancelled ]; then
            echo "::error::PR CI over the 20-minute budget (job cancelled by timeout). Open an optimization lane."
            exit 1
          fi
