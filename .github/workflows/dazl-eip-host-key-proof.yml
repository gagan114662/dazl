name: Verify Dazl Elastic IP host key
on:
  push:
    branches: [ziggy/eip-ssh-proof-20261119]
    paths: ['.github/workflows/dazl-eip-host-key-proof.yml']
permissions: {}
jobs:
  fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report the public SSH handshake and compare ED25519
        shell: bash
        run: |
          set -u
          f="$(mktemp)"
          k="$(mktemp)"
          trap 'rm -f "$f" "$k"' EXIT
          rc=0
          ssh-keyscan -v -T 15 -t ed25519 3.137.125.161 > "$f" || rc=$?
          printf 'keyscan exit %s; returned lines %s\n' "$rc" "$(wc -l < "$f")"
          awk '($1=="3.137.125.161" || $1=="[3.137.125.161]:22") && $2=="ssh-ed25519" && NF==3 {print "3.137.125.161", $2, $3}' "$f" | sort -u > "$k"
          if [ "$(wc -l < "$k")" -ne 1 ]; then echo 'Did not receive exactly one parseable ED25519 public key'; exit 1; fi
          fp="$(ssh-keygen -E sha256 -lf "$k" | awk '{print $2}')"
          if [ "$fp" != "SHA256:2sz5Y6JdfAc6zAMMuJmOJDvYfds7vb64frknnAGfzss" ]; then echo 'ED25519 did not match trusted AWS fingerprint'; exit 1; fi
          printf 'Verified EC2 ED25519: %s\n' "$fp"
          cat "$k"
