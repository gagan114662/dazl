name: never-again-gates
# docs/NEVER-AGAIN.md: the doc's own consistency test, the live-check gate's tests (#3) and the no-on-box-build tests (#1).
# Runs on every pull request (no path filter: the doc cites files across the repo, so any change can break it).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  never-again:
    runs-on: [self-hosted, Linux, X64, dazl-ci]
    container:
      image: ubuntu:24.04
      options: --cpus 4 --memory 6g --memory-swap 6g --pids-limit 2048 --shm-size 1g --umask 0022
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - name: Isolated job prerequisites
        working-directory: /
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl git tar gzip xz-utils unzip python3 python3-yaml build-essential sudo shellcheck
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: NEVER-AGAIN doc + live-check gate tests (.github/scripts)
        run: node --test '.github/scripts/*.test.mjs'
      - name: No build on the box (ops/test_never_again.py)
        run: python3 -m unittest discover -s ops -p 'test_never_again.py' -v
      - name: shellcheck the deploy scripts (errors only)
        run: shellcheck -S error ops/staging/deploy.sh ops/staging/pull-prebuilt.sh ops/prod/deploy-prod.sh ops/prod/pull-release.sh ops/prod/run-release.sh ops/prod/check-installed.sh
      - name: shellcheck the backup install scripts (errors only)
        run: shellcheck -S error ops/backup/install-prod.sh ops/backup/prod-run.sh ops/backup/live-release.sh ops/backup/restore-offhost.sh
