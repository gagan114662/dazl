name: web-preview
# A preview of each pull request before it reaches production: the PR's production build is started with a throwaway
# SQLite database and one seeded test account (test/smoke/harness.mjs), the existing production smoke checks run against
# it, and every page is screenshotted signed in at desktop and mobile width. The screenshots and an index.html are the
# run's "preview" artifact (Summary page of the run -> Artifacts); preview/billing shows Settings > Plan before and after
# each signed Stripe test-mode webhook (test/smoke/billing.smoke.mjs). No secrets are used: the server runs under the test
# network fence, so nothing is scanned, sent, billed or fetched from a provider. Not a hosted URL; see web/docs/DEPLOY.md.
on:
  pull_request:
    paths: ["web/**", ".github/workflows/web-preview.yml"]
permissions:
  contents: read
concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      # Playwright (and esbuild, for the rendered check) are not app dependencies: installed for this job only, the lockfile untouched
      - run: npm install --no-save playwright@1.63.0 esbuild@0.25.0 && npx playwright install --with-deps chromium
      # The rendered price-estimate check (stubbed: no server, db, network or key). esbuild bundles the page; installed with playwright for this job only, the lockfile untouched. It must run, not skip.
      - name: Rendered price-estimate and budget check
        run: node test/ui/budget.ui.mjs | tee /tmp/budget-ui.out && ! grep -q '^SKIP' /tmp/budget-ui.out
      # The #379 research review block in both clients (stubbed: no network, model or key; screenshots into preview/research-review). It must run, not skip.
      - name: Rendered research-review checks (first-run + leads draft editor)
        run: SHOTS=preview/research-review node test/ui/research-review.ui.mjs | tee /tmp/rr1.out && ! grep -q '^NOT RUN' /tmp/rr1.out && SHOTS=preview/research-review node test/ui/leads-research-review.ui.mjs | tee /tmp/rr2.out && ! grep -q '^NOT RUN' /tmp/rr2.out
      # InfoTip tooltip ids must be hydration-stable across SSR requests and survive hydration; the mount-class sweep must run, not skip.
      - name: InfoTip hydration stability (SSR-stable ids, zero hydration errors)
        run: node test/ui/infotip-hydration.ui.mjs | tee /tmp/it.out && ! grep -q '^NOT RUN' /tmp/it.out
      # The #420 manual-profile ready card and readiness panel: a saved-by-hand profile completes both surfaces without a website and the panel must not contradict the card. They must run, not skip.
      - name: Ready card and readiness panel (manual profile without a website)
        run: node test/ui/ready-card.ui.mjs | tee /tmp/rc.out && ! grep -q '^NOT RUN' /tmp/rc.out && node test/ui/readiness.ui.mjs | tee /tmp/rd.out && ! grep -q '^NOT RUN' /tmp/rd.out
      # refs #471: follow-ups held-state honesty on the real route (production build, throwaway db, synthetic fixtures, no stubbing, no send). It must run, not skip.
      - name: Follow-ups held states (promised date only when sendable; held shows reason + schedule date)
        run: SHOTS=preview/followups-held node test/ui/followups-held.ui.mjs | tee /tmp/fh.out && ! grep -q '^NOT RUN' /tmp/fh.out
      # The #410 trial line in Settings: a fresh account on an unconfigured trial is told the trial is unavailable, never that it used its scans; available counts down; used-up and throttled say their own reasons. It must run, not skip.
      - name: Trial status line (fresh, available, used-up, throttled)
        run: SHOTS=preview/trial-status node test/ui/trial-status.ui.mjs | tee /tmp/ts.out && ! grep -q '^NOT RUN' /tmp/ts.out
      # The #409 website-first free read: a keyless account gets the page's own source-labeled facts and the manual profile - no inference, no auto-save, no key demand; the keyed path keeps the AI fill; a failed read says the true reason and leaves the manual path. It must run, not skip.
      - name: Free site read (keyless facts with sources, keyed AI fill, failed read manual path)
        run: SHOTS=preview/free-site-read node test/ui/free-site-read.ui.mjs | tee /tmp/fsr.out && ! grep -q '^NOT RUN' /tmp/fsr.out
      - name: Screenshots of every page
        run: npm run preview:shots -- preview
        env:
          PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      - name: Billing in Settings through signed Stripe test-mode webhooks (screenshots into preview/billing)
        if: success() || failure()
        run: npm run test:smoke:billing -- preview/billing
      - name: Production smoke checks against the same build
        if: success() || failure()
        run: npm run test:smoke && npm run test:smoke:chunks
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: preview-pr${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: web/preview/
          retention-days: 14
          if-no-files-found: error
