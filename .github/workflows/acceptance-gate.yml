name: acceptance-gate
# docs/design/issue-closure-gate.md. Every job here reports what it actually did: success means the check ran and
# passed, failure means it ran and failed, and a check with nothing to run is SKIPPED by a job-level `if` - never a
# green step that only echoes "nothing to do". Nothing here closes an issue: the reviewer/owner closes issues after
# deploy + live proof (docs/PROCESS.md § "Closing issues").
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Manual only, and only meaningful on main: the one way the CRM sandbox job below can ever run.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acceptance-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Builders never use GitHub closing keywords (repo rule; owner comment on #569, 2026-11-02): a merged PR must not
  # auto-close an issue that has not been verified live. Fails if the PR body or any PR commit message has one.
  no-closing-keywords:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: PR body and commit messages use Refs, never Closes/Fixes/Resolves
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].commit.message' > /tmp/commits.txt
          printf '%s\n' "$BODY" > /tmp/body.txt
          node -e '
            const fs = require("fs");
            // GitHub closing keywords followed by #N, owner/repo#N or an issues URL (the forms GitHub acts on).
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\b\s*:?\s+(?:#\d+|[\w.-]+\/[\w.-]+#\d+|https?:\/\/github\.com\/[\w.-]+\/[\w.-]+\/issues\/\d+)/gi;
            let bad = 0;
            for (const [where, f] of [["the PR body", "/tmp/body.txt"], ["a commit message", "/tmp/commits.txt"]]) {
              for (const m of fs.readFileSync(f, "utf8").matchAll(re)) {
                bad++;
                console.log(`::error::closing keyword in ${where}: "${m[0]}". Use "Refs #N"; the reviewer/owner closes issues after live proof.`);
              }
            }
            if (bad) process.exit(1);
            console.log("No closing keyword in the PR body or its commit messages.");
          '

  # Which "Refs #N" issues declare at least one test NAMED with #N (static scan: runs no test, installs nothing).
  tag-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      numbers: ${{ steps.scope.outputs.numbers }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Referenced issues that have a tagged test
        id: scope
        working-directory: web
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          nums=$(node -e '
            const b = process.env.BODY || "";
            const re = /\brefs?\b\s*:?\s*(#[1-9]\d{0,6}\b(?:\s*(?:,|\/|&|and)?\s*#[1-9]\d{0,6}\b)*)/gi;
            const s = new Set([...b.matchAll(re)].flatMap((m) => [...m[1].matchAll(/#(\d+)/g)].map((x) => x[1])));
            console.log([...s].join(" "));
          ')
          if [ -z "$nums" ]; then
            echo "numbers=" >> "$GITHUB_OUTPUT"
            echo "No Refs #N in the PR body: tagged-tests will be SKIPPED."
            exit 0
          fi
          node scripts/gate-check.mjs --list $nums | tee -a "$GITHUB_OUTPUT"

  # Additive evidence: runs the tests named #N for each referenced issue with one; fails unless at least one tagged
  # test executed and everything passed (counts printed). SKIPPED when no referenced issue has a tagged test.
  tagged-tests:
    needs: tag-scope
    if: needs.tag-scope.outputs.numbers != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: gate-check on the referenced issues (evidence only; a PASS never closes an issue)
        env:
          NUMBERS: ${{ needs.tag-scope.outputs.numbers }}
        run: node scripts/gate-check.mjs ${NUMBERS//,/ }

  # Live sandbox-CRM check (scripts/crm-live-acceptance.mts, #634). Never runs on pull_request (SKIPPED there): a key
  # in a job that executes the PR head's own web/lib/crm code could be read by any same-repo PR that edits it
  # (PR #641 review, 2026-11-04). It can run only by manual dispatch on main (main's code), and only when a sandbox
  # key is present; without one it is SKIPPED, never a green no-op. No secret exists and a builder must not add
  # one: whether to provision it (an environment-scoped secret limited to main, never a repo secret that any
  # branch's workflow can read) is the owner's decision.
  crm-sandbox-preflight:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: crm-sandbox
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Is a sandbox CRM key configured? (presence only; no value is printed)
        id: check
        env:
          HAS_PROVIDER: ${{ secrets.CRM_ACCEPTANCE_PROVIDER != '' }}
          HAS_KEY: ${{ secrets.CRM_ACCEPTANCE_KEY != '' }}
        run: |
          if [ "$HAS_PROVIDER" = "true" ] && [ "$HAS_KEY" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No sandbox CRM key configured: crm-sandbox-acceptance will be SKIPPED."
          fi

  crm-sandbox-acceptance:
    needs: crm-sandbox-preflight
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.crm-sandbox-preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: crm-sandbox
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Exit 2 (refused), 1 (a step failed) or any other non-zero fails this job: nothing is mapped to success.
      - name: Sandbox live-provider acceptance (main's code)
        env:
          CRM_ACCEPTANCE: sandbox
          CRM_ACCEPTANCE_PROVIDER: ${{ secrets.CRM_ACCEPTANCE_PROVIDER }}
          CRM_ACCEPTANCE_KEY: ${{ secrets.CRM_ACCEPTANCE_KEY }}
          CRM_ACCEPTANCE_PIPEDRIVE_DOMAIN: ${{ secrets.CRM_ACCEPTANCE_PIPEDRIVE_DOMAIN }}
        run: node --experimental-strip-types scripts/crm-live-acceptance.mts
