name: session-worker-ci
on:
  pull_request:
    paths: ["session-worker/**", ".github/workflows/session-worker-ci.yml"]
  push:
    branches: [main]
    paths: ["session-worker/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
