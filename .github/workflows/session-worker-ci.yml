name: session-worker-ci
on:
  pull_request:
    paths: ["session-worker/**", ".github/workflows/session-worker-ci.yml"]
  push:
    branches: [main]
    paths: ["session-worker/**", ".github/workflows/session-worker-ci.yml"]
concurrency:
  group: session-worker-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, dazl-ci]
    container:
      image: ubuntu:24.04
      options: --cpus 4 --memory 6g --memory-swap 6g --pids-limit 2048 --shm-size 1g
    defaults:
      run:
        shell: bash
        working-directory: session-worker
    steps:
      - name: Isolated job prerequisites
        working-directory: /
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl git tar gzip xz-utils unzip python3 python3-yaml build-essential sudo
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
