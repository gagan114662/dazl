name: session-worker-ci
on:
  pull_request:
    paths: ["session-worker/**", ".github/workflows/session-worker-ci.yml"]
  push:
    branches: [main]
    paths: ["session-worker/**", ".github/workflows/session-worker-ci.yml"]
concurrency:
  group: session-worker-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
