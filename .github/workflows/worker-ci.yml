name: worker-ci
on:
  pull_request:
    paths: ["worker/**", ".github/workflows/worker-ci.yml"]
  push:
    branches: [main]
    paths: ["worker/**"]
concurrency:
  group: worker-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, dazl-ci]
    container:
      image: ubuntu:24.04
      options: --cpus 4 --memory 6g --memory-swap 6g --pids-limit 2048 --shm-size 1g --umask 0022
    env:
      NPM_CONFIG_CACHE: /tmp/ci-npm-cache
    defaults:
      run:
        shell: ci-bash {0}
        working-directory: worker
    steps:
      - name: Isolated job prerequisites
        shell: bash
        working-directory: /
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl git tar gzip xz-utils unzip python3 python3-yaml build-essential sudo sqlite3 rsync age passwd
      - uses: actions/checkout@v4
      - name: Install non-root CI command shell
        shell: bash
        working-directory: /
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-container-bootstrap.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The deployed advanced-connectors worker (server.js + lib/*.js) is dependency-free
      # Node; npm test runs its node:test contract suites (test/*.test.js).
      # The previous tsc/vitest steps never ran: the lockfile carries no devDependencies,
      # so npx fetched the unrelated `tsc` package and the job failed before any test
      # (worker-ci red on every run since 2026-10-21). The TS Cloudflare product under
      # worker/src has no locked toolchain; restoring it is a separate change, not this one.
      - run: npm test
