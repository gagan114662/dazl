name: worker-ci
on:
  pull_request:
    paths: ["worker/**", ".github/workflows/worker-ci.yml"]
  push:
    branches: [main]
    paths: ["worker/**"]
concurrency:
  group: worker-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The deployed advanced-connectors worker (server.js + lib/*.js) is dependency-free
      # Node; npm test runs its node:test contract suites (test/*.test.js).
      # It has no dependencies to install, so there is no lockfile and no `npm ci` step.
      - run: npm test
