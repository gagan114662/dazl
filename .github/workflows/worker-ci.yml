name: worker-ci
on:
  pull_request:
    paths: ["worker/**", ".github/workflows/worker-ci.yml"]
  push:
    branches: [main]
    paths: ["worker/**"]
concurrency:
  group: worker-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The deployed advanced-connectors worker (server.js + lib/*.js) is dependency-free
      # Node; npm test runs its node:test contract suites (test/*.test.js).
      # The previous tsc/vitest steps never ran: the lockfile carries no devDependencies,
      # so npx fetched the unrelated `tsc` package and the job failed before any test
      # (worker-ci red on every run since 2026-10-21). The TS Cloudflare product under
      # worker/src has no locked toolchain; restoring it is a separate change, not this one.
      - run: npm test
