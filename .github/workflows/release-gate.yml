name: release-gate
# What must hold before a commit is deployed (issue #362; web/docs/DEPLOY.md "Release gate"). Runs on every pull request
# touching web/ or ops/, and on every push to main, so the exact commit Instinct deploys has a run of its own:
# - browser: the production build, then every production smoke check against it in Chromium: pages and chunks load,
#   chunk-load recovery, the /app sign-in gate, the two-tenant leak check, release identity plus readiness, and the
#   recovery drill (docs/RECOVERY.md) on a synthetic backup with the app started on the restored copy;
# - migrations: the previous release's SQLite database (filled by its own synthetic staging seed and a stored key) is
#   migrated by this release keeping every row and value, a second migration changes nothing, the previous release's
#   migration changes no value either, and each release's own code verifies the demo password and decrypts the key.
#   Then the previous release's production build is started on the migrated database: ready, sign-in, scans and leads
#   (rollback). The base is the PR's base commit, or the commit main was at before the push.
# The run's release-<sha> artifact is the release manifest (ops/release-manifest.mjs): commit, Next BUILD_ID, static
# file sha256s, lockfile sha256, PG migrations. After a deploy, `node ops/release-manifest.mjs check release.json <url>`
# proves the server serves that commit, every static file with exactly the recorded bytes, and is ready. No secrets: servers run under the test network fence with
# throwaway databases and generated test-mode values, so nothing is scanned, sent, billed or fetched.
on:
  pull_request:
    paths: ["web/**", "ops/**", "session-worker/**", ".github/workflows/web-ci.yml", ".github/workflows/release-gate.yml", ".github/workflows/release-preflight.yml", ".github/workflows/session-worker-ci.yml"]
  push:
    branches: [main]
    paths: ["web/**", "ops/**", "session-worker/**", ".github/workflows/web-ci.yml", ".github/workflows/release-gate.yml", ".github/workflows/release-preflight.yml", ".github/workflows/session-worker-ci.yml"]
permissions:
  contents: read
concurrency:
  group: release-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Release manifest
        run: node ../ops/release-manifest.mjs write . release.json && cat release.json
      # Playwright is not an app dependency: installed for this job only, the lockfile untouched
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Every /app page loads (no page/console error, no missing asset)
        run: npm run test:smoke
      - name: Chunk-load recovery
        if: success() || failure()
        run: npm run test:smoke:chunks
      - name: Sign-in gate on every /app page
        if: success() || failure()
        run: npm run test:smoke:auth
      - name: Credential forms never fall back to a native GET (JS disabled)
        if: success() || failure()
        run: npm run test:smoke:authforms
      - name: Two tenants, no cross-tenant data on any route or page
        if: success() || failure()
        run: npm run test:smoke:tenants
      - name: Saved-source recheck action and refusal states (fenced)
        if: success() || failure()
        run: node --experimental-strip-types test/smoke/evidence-recheck.smoke.mjs
      - name: Seller intelligence Add/Dismiss/Restore production UI (fenced)
        if: success() || failure()
        run: node test/smoke/intelligence.smoke.mjs && node test/smoke/intelligence-chain.smoke.mjs
      - name: Upload seller intelligence UI pixels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            web/preview/intelligence
            web/preview/intelligence-chain
          if-no-files-found: error
      - name: Release identity and readiness
        if: success() || failure()
        run: npm run test:smoke:release
      - name: Recovery drill with the app (synthetic backup, sending disabled)
        if: success() || failure()
        run: npm run test:smoke:recovery
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: release-${{ github.event.pull_request.head.sha || github.sha }}
          path: web/release.json
          retention-days: 90
          if-no-files-found: error

  # Runnable release artifact, matching the accepted 010 contract (recovered by infra from its receipts):
  # the artifact is ONLY the compiled .next tree + the exact .build-commit marker. The stage supplies a
  # clean exact git checkout of the same commit (public/, next.config.ts, package files, ops, source);
  # dependencies come from the runtime's own store (runner deps here; the arm64 host store symlink in the
  # checked-release path). Zero native payloads, zero env/key material: scans fail the run otherwise.
  # The extract smoke performs the real runtime assembly: overlay the artifact onto a CLEAN checkout of
  # the same commit with freshly installed runner deps, boot the result, and verify release identity,
  # readiness, a page and a public asset. Nothing here provisions anything on the host.
  package:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - id: pack
        name: Deterministic zero-native artifact (.next + .build-commit), sha256, per-file manifest
        run: |
          set -euo pipefail
          node ../ops/release-manifest.mjs write . release.json
          # .next/cache is build-time state (turbopack store, ~195 MB here), not runtime: the 010 contract
          # artifact is 28 MB. Exclude it; .next/server + .next/static carry everything next start serves.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --exclude='*.node' --exclude='*.so' --exclude='*.so.*' --exclude='.next/cache' \
            -czf "../release-app-$JOB_SHA.tar.gz" .next .build-commit
          cd ..
          sha256sum "release-app-$JOB_SHA.tar.gz" > "release-app-$JOB_SHA.tar.gz.sha256"
          python3 - <<'PYSCAN'
          import hashlib, json, os, tarfile
          entries = []
          with tarfile.open(f"release-app-{os.environ['JOB_SHA']}.tar.gz") as tf:
              for m in tf.getmembers():
                  if m.isfile():
                      entries.append({"path": m.name, "size": m.size, "sha256": hashlib.sha256(tf.extractfile(m).read()).hexdigest()})
          json.dump({"commit": os.environ["JOB_SHA"], "files": entries, "file_count": len(entries)}, open("tarball-manifest.json", "w"), indent=1)
          PYSCAN
      - id: scans
        name: "Artifact scans: zero native, no key material, no env files"
        working-directory: web
        run: |
          set -euo pipefail
          tar -tzf "$GITHUB_WORKSPACE/release-app-$JOB_SHA.tar.gz" > tar-list.txt
          if grep -E '(^|/)(\.env[^/]*|.*\.pem|id_rsa|.*\.key)$' tar-list.txt; then echo 'env/key file in artifact'; exit 1; fi
          if grep -E '\.(node|so)(\.[0-9]+)*$' tar-list.txt; then echo 'native payload in artifact (contract is zero-native)'; exit 1; fi
          rm -rf /tmp/artifact-scan && mkdir -p /tmp/artifact-scan && tar -xzf "$GITHUB_WORKSPACE/release-app-$JOB_SHA.tar.gz" -C /tmp/artifact-scan
          if find /tmp/artifact-scan -type f -exec sh -c 'head -c 4 "$1" | grep -q "^.ELF"' _ {} \; -print | grep .; then echo 'ELF binary in artifact'; exit 1; fi
          if grep -rIl 'BEGIN [A-Z ]*PRIVATE KEY' /tmp/artifact-scan | head -1 | grep .; then echo 'key material in artifact'; exit 1; fi
      - name: Clean exact checkout for the runtime-assembly smoke
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: assembly
          clean: true
      - name: "Runtime-assembly smoke: artifact overlaid on the clean checkout boots and serves its release"
        working-directory: web
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/assembly/web"
          npm ci --no-audit --no-fund
          tar -xzf "$GITHUB_WORKSPACE/release-app-$JOB_SHA.tar.gz" -C .
          test "$(cat .build-commit)" = "$JOB_SHA"
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          # The net fence deletes every *KEY*/*SECRET* env var, so readiness values arrive under the neutral
          # SMOKE_* names the repo's own stripe-test-env.mjs restores after the fence (release-identity smoke pattern).
          export DB_PATH=/tmp/relcheck-scratch/app.db \
            PUBLIC_BASE_URL="http://127.0.0.1:$PORT" NODE_ENV=production SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 \
            SMOKE_MASTER_B64=$(head -c 32 /dev/urandom | base64) \
            SMOKE_STRIPE_SK="sk_test_relcheck$(python3 -c 'import secrets;print(secrets.token_hex(6))')" \
            SMOKE_STRIPE_WHSEC="whsec_relcheck$(python3 -c 'import secrets;print(secrets.token_hex(12))')" \
            STRIPE_PRICE_PRO="price_relcheck" \
            NODE_OPTIONS="--experimental-strip-types --import $GITHUB_WORKSPACE/assembly/web/test/helpers/net-fence.ts --import $GITHUB_WORKSPACE/assembly/web/test/smoke/stripe-test-env.mjs"
          mkdir -p /tmp/relcheck-scratch
          node node_modules/next/dist/bin/next start -p "$PORT" -H 127.0.0.1 & SPID=$!
          trap 'kill $SPID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$PORT/api/ready" >/dev/null 2>&1 && break; sleep 1; done
          curl -sf "http://127.0.0.1:$PORT/api/ready" >/dev/null
          node "$GITHUB_WORKSPACE/ops/release-manifest.mjs" check "$GITHUB_WORKSPACE/web/release.json" "http://127.0.0.1:$PORT"
          curl -sf "http://127.0.0.1:$PORT/" >/dev/null
          # Next serves public/<path> at the site root, not under /public: strip the directory prefix.
          ASSET=$(find public -type f | sort | head -1); [ -n "$ASSET" ]
          curl -sf "http://127.0.0.1:$PORT/${ASSET#public/}" >/dev/null || { echo "public asset $ASSET not served"; exit 1; }
      # Upload only after the build, packaging and EVERY security scan succeeded; a later smoke failure
      # still uploads (the gates are proven by then), but a rejected payload is never published.
      - name: Upload runnable release artifact
        uses: actions/upload-artifact@v4
        if: always() && steps.pack.outcome == 'success' && steps.scans.outcome == 'success'
        with:
          name: release-app-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-app-${{ github.event.pull_request.head.sha || github.sha }}.tar.gz
            release-app-${{ github.event.pull_request.head.sha || github.sha }}.tar.gz.sha256
            tarball-manifest.json
            web/release.json
          retention-days: 90
          if-no-files-found: error

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Previous release checkout and production build
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # a new branch or a forced push has no usable "before": fall back to the first parent
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD^); fi
          echo "previous release: $BASE"
          echo "PREV_SHA=$BASE" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/prev" "$BASE"
          cd "$RUNNER_TEMP/prev/web" && npm ci --no-audit --no-fund && npm run build
      - name: Forward, re-run and rollback on a seeded database (every row and value, password, key decryption)
        working-directory: web
        run: node --experimental-strip-types --no-warnings scripts/migration-gate.mts "$RUNNER_TEMP/prev/web" --keep "$RUNNER_TEMP/gate"
      - name: The previous release's production build starts, signs in and reads its data on the migrated database
        working-directory: web
        run: node scripts/rollback-start-check.mjs "$RUNNER_TEMP/prev/web" "$RUNNER_TEMP/gate" "$PREV_SHA"
