name: release-gate
# What must hold before a commit is deployed (issue #362; web/docs/DEPLOY.md "Release gate"). Runs on every pull request
# touching web/ or ops/, and on every push to main, so the exact commit Instinct deploys has a run of its own:
# - browser: the production build, then every production smoke check against it in Chromium: pages and chunks load,
#   chunk-load recovery, the /app sign-in gate, the two-tenant leak check, the scan view transparency UI
#   harness on fenced fixture data, release identity plus readiness, and the
#   recovery drill (docs/RECOVERY.md) on a synthetic backup with the app started on the restored copy;
# - migrations: the previous release's SQLite database (filled by its own synthetic staging seed and a stored key) is
#   migrated by this release keeping every row and value, a second migration changes nothing, the previous release's
#   migration changes no value either, and each release's own code verifies the demo password and decrypts the key.
#   Then the previous release's production build is started on the migrated database: ready, sign-in, scans and leads
#   (rollback). The base is the PR's base commit, or the commit main was at before the push.
# The run's release-<sha> artifact is the release manifest (ops/release-manifest.mjs): commit, Next BUILD_ID, static
# file sha256s, lockfile sha256, PG migrations. After a deploy, `node ops/release-manifest.mjs check release.json <url>`
# proves the server serves that commit, every static file with exactly the recorded bytes, and is ready. No secrets: servers run under the test network fence with
# throwaway databases and generated test-mode values, so nothing is scanned, sent, billed or fetched.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  # Manual runs on main can validate and package the selected commit. The migrations base falls back
  # to its first parent.
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  # PRs cancel stale runs. Main pushes share a group so the active run finishes
  # and GitHub replaces older pending runs with the newest one.
  group: ${{ github.event_name == 'push' && 'release-gate-main' || format('release-gate-{0}', github.event.pull_request.number || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  FULL_CI: ${{ github.event_name == 'push' || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || contains(github.event.pull_request.labels.*.name, 'ready-to-merge') || contains(github.event.pull_request.labels.*.name, 'quest-approved') }}
jobs:
  browser:
    runs-on: ${{ github.event_name == 'pull_request' && vars.PR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Explain deferred full suite
        if: env.FULL_CI != 'true'
        working-directory: .
        run: echo "full suite deferred until ready-to-merge" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.FULL_CI == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: env.FULL_CI == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: env.FULL_CI == 'true'
      - run: npm run build
        if: env.FULL_CI == 'true'
      - name: Release manifest
        if: env.FULL_CI == 'true'
        run: node ../ops/release-manifest.mjs write . release.json && cat release.json
      # Playwright is not an app dependency: installed for this job only, the lockfile untouched
      # Playwright's Chromium download is cached per version (it took up to 7.5 min uncached); --with-deps still installs the OS libraries every run
      - uses: actions/cache@v4
        if: env.FULL_CI == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browser-full-v1-1.63.0-${{ runner.os }}-${{ runner.arch }}
      - run: npm install --no-save playwright@1.63.0 esbuild@0.25.0 && npx playwright install --with-deps chromium
        if: env.FULL_CI == 'true'
      # #1834: the phone menu's More toggle collapses again on navigation, and the summary's preventDefault
      # keeps details.open and aria-expanded in agreement (PR #1878). It must run, not skip.
      - name: Nav More toggle reset on navigation (#1834)
        if: env.FULL_CI == 'true' && (success() || failure())
        run: |
          set -o pipefail
          node test/ui/nav-more-1834.ui.mjs | tee /tmp/nav-more.out
          ! grep -q '^NOT RUN' /tmp/nav-more.out
      - name: Every /app page loads (no page/console error, no missing asset)
        if: env.FULL_CI == 'true'
        run: npm run test:smoke
      - name: Chunk-load recovery
        if: env.FULL_CI == 'true' && (success() || failure())
        run: npm run test:smoke:chunks
      - name: Sign-in gate on every /app page
        if: env.FULL_CI == 'true' && (success() || failure())
        run: npm run test:smoke:auth
      - name: Credential fallback and hydrated desktop and mobile sign-up
        if: env.FULL_CI == 'true' && (success() || failure())
        run: npm run test:smoke:authforms
      - name: Two tenants, no cross-tenant data on any route or page
        if: env.FULL_CI == 'true' && (success() || failure())
        run: npm run test:smoke:tenants
      - name: Inbox UI - filters, paging and the bounce_review badge
        if: env.FULL_CI == 'true' && (success() || failure())
        run: mkdir -p /tmp/inbox-shots && SHOTS=/tmp/inbox-shots node --experimental-strip-types test/ui/inbox.ui.mjs
      - name: Inbox UI screenshots
        if: env.FULL_CI == 'true' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: inbox-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/inbox-shots/*.png
          retention-days: 30
      - name: Saved-source recheck action and refusal states (fenced)
        if: env.FULL_CI == 'true' && (success() || failure())
        run: node --experimental-strip-types test/smoke/evidence-recheck.smoke.mjs
      - name: Hiring provenance and lead cards (fenced)
        if: env.FULL_CI == 'true' && (success() || failure())
        run: |
          mkdir -p preview/lead-cards
          SHOTS=preview/lead-cards node test/ui/lead-cards.ui.mjs
          SHOTS=preview/lead-cards node test/ui/work-email-review-lane.ui.mjs
      - uses: actions/upload-artifact@v4
        if: env.FULL_CI == 'true' && (always())
        with:
          name: lead-cards-${{ github.event.pull_request.head.sha || github.sha }}
          path: web/preview/lead-cards/*.png
          retention-days: 14
      - name: Seller intelligence chain (fenced)
        if: env.FULL_CI == 'true' && (success() || failure())
        run: node test/smoke/intelligence-chain.smoke.mjs
      - name: Signed website review, estimate, and confirmed submission
        if: env.FULL_CI == 'true' && (success() || failure())
        run: SHOTS=preview/leads-research-review node --experimental-strip-types test/ui/signed-website-review.ui.mjs
      - name: Upload seller intelligence UI pixels
        if: env.FULL_CI == 'true' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            web/preview/intelligence-chain
            web/preview/leads-research-review
          if-no-files-found: error
      # Scan view transparency: the unmodified fixture-fenced UI harness (test/ui/scan-transparency.ui.mjs)
      # must render real route bytes - provider failures, cost per verification pass, honest unavailable
      # states. The harness exits 0 on SKIP when esbuild/playwright are missing, so the grep makes the
      # gate fail-closed: a SKIP is a failed check here, never a silent pass.
      - name: Scan view provider-failure transparency and per-verification-pass cost UI (fenced fixture)
        if: env.FULL_CI == 'true' && (success() || failure())
        run: |
          set -o pipefail
          npm install --no-save esbuild playwright@1.63.0
          SHOT_A=preview/scan-transparency/branch-a.png SHOT_B=preview/scan-transparency/branch-b.png SHOT_C=preview/scan-transparency/telemetry-unknown.png \
            node test/ui/scan-transparency.ui.mjs 2>&1 | tee /tmp/scan-transparency-ui.log
          ! grep -q '^SKIP' /tmp/scan-transparency-ui.log
      - name: Upload scan transparency UI pixels
        if: env.FULL_CI == 'true' && (always())
        uses: actions/upload-artifact@v4
        with:
          name: scan-transparency-ui-${{ github.event.pull_request.head.sha || github.sha }}
          path: web/preview/scan-transparency
          if-no-files-found: error
      - name: Release identity and readiness
        if: env.FULL_CI == 'true' && (success() || failure())
        run: npm run test:smoke:release
      - name: Recovery drill with the app (synthetic backup, sending disabled)
        if: env.FULL_CI == 'true' && (success() || failure())
        run: npm run test:smoke:recovery
      # issue #360: the whole host-loss path (encrypted off-host copy + secrets/config bundle -> fetch, decrypt with the
      # separately held identities and master key, the app on the restored copy: sign-in, scan, reads, sending off).
      # age is installed here for it; the smoke exits 2 (NOT RUN, a failure) when age or the build is missing.
      - name: Replacement-host restore drill (off-host copy, secrets/config, sign-in/decrypt/scan/read)
        if: env.FULL_CI == 'true' && (success() || failure())
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q age
          npm run test:smoke:replacement
      - uses: actions/upload-artifact@v4
        if: env.FULL_CI == 'true' && (success())
        with:
          name: release-${{ github.event.pull_request.head.sha || github.sha }}
          path: web/release.json
          retention-days: 90
          if-no-files-found: error

  # Runnable release artifact, matching the accepted 010 contract (recovered by infra from its receipts):
  # the artifact is ONLY the compiled .next tree + the exact .build-commit marker. The stage supplies a
  # clean exact git checkout of the same commit (public/, next.config.ts, package files, ops, source);
  # dependencies come from the runtime's own store (runner deps here; the arm64 host store symlink in the
  # checked-release path). Zero native payloads, zero env/key material: scans fail the run otherwise.
  # The extract smoke performs the real runtime assembly: overlay the artifact onto a CLEAN checkout of
  # the same commit with freshly installed runner deps, boot the result, and verify release identity,
  # readiness, a page and a public asset. Nothing here provisions anything on the host.
  package:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Explain deferred full suite
        if: env.FULL_CI != 'true'
        working-directory: .
        run: echo "full suite deferred until ready-to-merge" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.FULL_CI == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        if: env.FULL_CI == 'true'
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: env.FULL_CI == 'true'
      - run: npm run build
        if: env.FULL_CI == 'true'
      - run: node scripts/check-fixture-route-artifact.mjs production
        if: env.FULL_CI == 'true'
      - id: pack
        if: env.FULL_CI == 'true'
        name: Deterministic zero-native artifact (.next + .build-commit), sha256, per-file manifest
        run: |
          set -euo pipefail
          node ../ops/release-manifest.mjs write . release.json
          # .next/cache is build-time state (turbopack store, ~195 MB here), not runtime: the 010 contract
          # artifact is 28 MB. Exclude it; .next/server + .next/static carry everything next start serves.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --exclude='*.node' --exclude='*.so' --exclude='*.so.*' --exclude='.next/cache' \
            -czf "../release-app-$JOB_SHA.tar.gz" .next .build-commit
          cd ..
          sha256sum "release-app-$JOB_SHA.tar.gz" > "release-app-$JOB_SHA.tar.gz.sha256"
          python3 - <<'PYSCAN'
          import hashlib, json, os, tarfile
          entries = []
          with tarfile.open(f"release-app-{os.environ['JOB_SHA']}.tar.gz") as tf:
              for m in tf.getmembers():
                  if m.isfile():
                      entries.append({"path": m.name, "size": m.size, "sha256": hashlib.sha256(tf.extractfile(m).read()).hexdigest()})
          json.dump({"commit": os.environ["JOB_SHA"], "files": entries, "file_count": len(entries)}, open("tarball-manifest.json", "w"), indent=1)
          PYSCAN
      - id: scans
        if: env.FULL_CI == 'true'
        name: "Artifact scans: zero native, no key material, no env files"
        working-directory: web
        run: |
          set -euo pipefail
          tar -tzf "$GITHUB_WORKSPACE/release-app-$JOB_SHA.tar.gz" > tar-list.txt
          if grep -E '(^|/)(\.env[^/]*|.*\.pem|id_rsa|.*\.key)$' tar-list.txt; then echo 'env/key file in artifact'; exit 1; fi
          if grep -E '\.(node|so)(\.[0-9]+)*$' tar-list.txt; then echo 'native payload in artifact (contract is zero-native)'; exit 1; fi
          rm -rf /tmp/artifact-scan && mkdir -p /tmp/artifact-scan && tar -xzf "$GITHUB_WORKSPACE/release-app-$JOB_SHA.tar.gz" -C /tmp/artifact-scan
          if find /tmp/artifact-scan -type f -exec sh -c 'head -c 4 "$1" | grep -q "^.ELF"' _ {} \; -print | grep .; then echo 'ELF binary in artifact'; exit 1; fi
          if grep -rIl 'BEGIN [A-Z ]*PRIVATE KEY' /tmp/artifact-scan | head -1 | grep .; then echo 'key material in artifact'; exit 1; fi
      - name: Clean exact checkout for the runtime-assembly smoke
        if: env.FULL_CI == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: assembly
          clean: true
      - name: "Runtime-assembly smoke: artifact overlaid on the clean checkout boots and serves its release"
        if: env.FULL_CI == 'true'
        working-directory: web
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/assembly/web"
          npm ci --no-audit --no-fund
          tar -xzf "$GITHUB_WORKSPACE/release-app-$JOB_SHA.tar.gz" -C .
          test "$(cat .build-commit)" = "$JOB_SHA"
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          # The net fence deletes every *KEY*/*SECRET* env var, so readiness values arrive under the neutral
          # SMOKE_* names the repo's own stripe-test-env.mjs restores after the fence (release-identity smoke pattern).
          export DB_PATH=/tmp/relcheck-scratch/app.db \
            PUBLIC_BASE_URL="http://127.0.0.1:$PORT" NODE_ENV=production SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 \
            SMOKE_MASTER_B64=$(head -c 32 /dev/urandom | base64) \
            SMOKE_STRIPE_SK="sk_test_relcheck$(python3 -c 'import secrets;print(secrets.token_hex(6))')" \
            SMOKE_STRIPE_WHSEC="whsec_relcheck$(python3 -c 'import secrets;print(secrets.token_hex(12))')" \
            STRIPE_PRICE_PRO="price_relcheck" \
            NODE_OPTIONS="--experimental-strip-types --import $GITHUB_WORKSPACE/assembly/web/test/helpers/net-fence.ts --import $GITHUB_WORKSPACE/assembly/web/test/smoke/stripe-test-env.mjs"
          mkdir -p /tmp/relcheck-scratch
          node node_modules/next/dist/bin/next start -p "$PORT" -H 127.0.0.1 & SPID=$!
          trap 'kill $SPID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$PORT/api/ready" >/dev/null 2>&1 && break; sleep 1; done
          curl -sf "http://127.0.0.1:$PORT/api/ready" >/dev/null
          node "$GITHUB_WORKSPACE/ops/release-manifest.mjs" check "$GITHUB_WORKSPACE/web/release.json" "http://127.0.0.1:$PORT"
          curl -sf "http://127.0.0.1:$PORT/" >/dev/null
          # Next serves public/<path> at the site root, not under /public: strip the directory prefix.
          ASSET=$(find public -type f | sort | head -1); [ -n "$ASSET" ]
          curl -sf "http://127.0.0.1:$PORT/${ASSET#public/}" >/dev/null || { echo "public asset $ASSET not served"; exit 1; }
      # Upload only after the build, packaging and EVERY security scan succeeded; a later smoke failure
      # still uploads (the gates are proven by then), but a rejected payload is never published.
      - name: Upload runnable release artifact
        uses: actions/upload-artifact@v4
        if: env.FULL_CI == 'true' && (always() && steps.pack.outcome == 'success' && steps.scans.outcome == 'success')
        with:
          name: release-app-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-app-${{ github.event.pull_request.head.sha || github.sha }}.tar.gz
            release-app-${{ github.event.pull_request.head.sha || github.sha }}.tar.gz.sha256
            tarball-manifest.json
            web/release.json
          retention-days: 90
          if-no-files-found: error

  # Staging-variant runnable artifact (#673/#780 deploy path). DAZL_ENV and PUBLIC_BASE_URL are read at BUILD time (the
  # banner is in the prerendered shell, robots.txt and the X-Robots-Tag header are baked, canonical/og:url come from
  # SITE_BASE), so the production artifact above can never serve staging.dazl.ai. This job compiles the same commit with
  # DAZL_ENV=staging and PUBLIC_BASE_URL=https://staging.dazl.ai and ships the same shape: ONLY .next + .build-commit,
  # same zero-native / no-key scans. The production job and its artifact are unchanged. Before upload, the artifact is
  # overlaid on a clean checkout and booted, and ops/staging-variant-check.mjs asserts on the booted server: robots
  # disallows all and names no sitemap, X-Robots-Tag noindex, the "Staging - test data" banner, staging canonical/og:url
  # with no production origin, and the exact commit stamp. No secrets: the values are public constants.
  package-staging:
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      STAGING_PUBLIC_BASE: https://staging.dazl.ai
    defaults:
      run:
        working-directory: web
    steps:
      - name: Explain deferred full suite
        if: env.FULL_CI != 'true'
        working-directory: .
        run: echo "full suite deferred until ready-to-merge" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.FULL_CI == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        if: env.FULL_CI == 'true'
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: env.FULL_CI == 'true'
      - name: Checker self-test (production-shaped responses must fail every marker)
        if: env.FULL_CI == 'true'
        working-directory: .
        run: node --test ops/staging-variant-check.test.mjs
      - name: Staging build (DAZL_ENV=staging, PUBLIC_BASE_URL at build time)
        if: env.FULL_CI == 'true'
        run: npm run build
        env:
          DAZL_ENV: staging
          PUBLIC_BASE_URL: ${{ env.STAGING_PUBLIC_BASE }}
      - run: node scripts/check-fixture-route-artifact.mjs staging
        if: env.FULL_CI == 'true'
      - id: pack
        if: env.FULL_CI == 'true'
        name: Deterministic zero-native artifact (.next + .build-commit), sha256, per-file manifest
        run: |
          set -euo pipefail
          node ../ops/release-manifest.mjs write . release.json
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --exclude='*.node' --exclude='*.so' --exclude='*.so.*' --exclude='.next/cache' \
            -czf "../release-app-staging-$JOB_SHA.tar.gz" .next .build-commit
          cd ..
          sha256sum "release-app-staging-$JOB_SHA.tar.gz" > "release-app-staging-$JOB_SHA.tar.gz.sha256"
          python3 - <<'PYSCAN'
          import hashlib, json, os, tarfile
          entries = []
          with tarfile.open(f"release-app-staging-{os.environ['JOB_SHA']}.tar.gz") as tf:
              for m in tf.getmembers():
                  if m.isfile():
                      entries.append({"path": m.name, "size": m.size, "sha256": hashlib.sha256(tf.extractfile(m).read()).hexdigest()})
          json.dump({"commit": os.environ["JOB_SHA"], "variant": "staging", "files": entries, "file_count": len(entries)}, open("tarball-manifest-staging.json", "w"), indent=1)
          PYSCAN
      - id: scans
        if: env.FULL_CI == 'true'
        name: "Artifact scans: zero native, no key material, no env files"
        run: |
          set -euo pipefail
          tar -tzf "$GITHUB_WORKSPACE/release-app-staging-$JOB_SHA.tar.gz" > tar-list.txt
          if grep -E '(^|/)(\.env[^/]*|.*\.pem|id_rsa|.*\.key)$' tar-list.txt; then echo 'env/key file in artifact'; exit 1; fi
          if grep -E '\.(node|so)(\.[0-9]+)*$' tar-list.txt; then echo 'native payload in artifact (contract is zero-native)'; exit 1; fi
          rm -rf /tmp/artifact-scan && mkdir -p /tmp/artifact-scan && tar -xzf "$GITHUB_WORKSPACE/release-app-staging-$JOB_SHA.tar.gz" -C /tmp/artifact-scan
          if find /tmp/artifact-scan -type f -exec sh -c 'head -c 4 "$1" | grep -q "^.ELF"' _ {} \; -print | grep .; then echo 'ELF binary in artifact'; exit 1; fi
          if grep -rIl 'BEGIN [A-Z ]*PRIVATE KEY' /tmp/artifact-scan | head -1 | grep .; then echo 'key material in artifact'; exit 1; fi
      - name: Clean exact checkout for the runtime-assembly smoke
        if: env.FULL_CI == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: assembly
          clean: true
      - name: "Runtime-assembly smoke: staging artifact boots, serves its release and proves every staging marker"
        if: env.FULL_CI == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/assembly/web"
          npm ci --no-audit --no-fund
          tar -xzf "$GITHUB_WORKSPACE/release-app-staging-$JOB_SHA.tar.gz" -C .
          test "$(cat .build-commit)" = "$JOB_SHA"
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          export DB_PATH=/tmp/relcheck-scratch/app.db \
            DAZL_ENV=staging PUBLIC_BASE_URL="$STAGING_PUBLIC_BASE" NODE_ENV=production SITECRAWL_ENABLED=0 NEWS_SEARCH_ENABLED=0 \
            SMOKE_MASTER_B64=$(head -c 32 /dev/urandom | base64) \
            SMOKE_STRIPE_SK="sk_test_relcheck$(python3 -c 'import secrets;print(secrets.token_hex(6))')" \
            SMOKE_STRIPE_WHSEC="whsec_relcheck$(python3 -c 'import secrets;print(secrets.token_hex(12))')" \
            STRIPE_PRICE_PRO="price_relcheck" \
            NODE_OPTIONS="--experimental-strip-types --import $GITHUB_WORKSPACE/assembly/web/test/helpers/net-fence.ts --import $GITHUB_WORKSPACE/assembly/web/test/smoke/stripe-test-env.mjs"
          mkdir -p /tmp/relcheck-scratch
          node node_modules/next/dist/bin/next start -p "$PORT" -H 127.0.0.1 & SPID=$!
          trap 'kill $SPID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$PORT/api/ready" >/dev/null 2>&1 && break; sleep 1; done
          curl -sf "http://127.0.0.1:$PORT/api/ready" >/dev/null
          node "$GITHUB_WORKSPACE/ops/release-manifest.mjs" check "$GITHUB_WORKSPACE/web/release.json" "http://127.0.0.1:$PORT"
          node "$GITHUB_WORKSPACE/ops/staging-variant-check.mjs" "http://127.0.0.1:$PORT" "$STAGING_PUBLIC_BASE" "$JOB_SHA"
      - name: Upload staging runnable release artifact
        uses: actions/upload-artifact@v4
        if: env.FULL_CI == 'true' && (always() && steps.pack.outcome == 'success' && steps.scans.outcome == 'success')
        with:
          name: release-app-staging-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            release-app-staging-${{ github.event.pull_request.head.sha || github.sha }}.tar.gz
            release-app-staging-${{ github.event.pull_request.head.sha || github.sha }}.tar.gz.sha256
            tarball-manifest-staging.json
            web/release.json
          retention-days: 90
          if-no-files-found: error

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Explain deferred full suite
        if: env.FULL_CI != 'true'
        working-directory: .
        run: echo "full suite deferred until ready-to-merge" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.FULL_CI == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: env.FULL_CI == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        if: env.FULL_CI == 'true'
        working-directory: web
      - name: Previous release checkout and production build
        if: env.FULL_CI == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          # a new branch or a forced push has no usable "before": fall back to the first parent
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD^); fi
          echo "previous release: $BASE"
          echo "PREV_SHA=$BASE" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/prev" "$BASE"
          cd "$RUNNER_TEMP/prev/web" && npm ci --no-audit --no-fund && npm run build
      - name: Forward, re-run and rollback on a seeded database (every row and value, password, key decryption)
        if: env.FULL_CI == 'true'
        working-directory: web
        run: node --experimental-strip-types --no-warnings scripts/migration-gate.mts "$RUNNER_TEMP/prev/web" --keep "$RUNNER_TEMP/gate"
      - name: The previous release's production build starts, signs in and reads its data on the migrated database
        if: env.FULL_CI == 'true'
        working-directory: web
        run: node scripts/rollback-start-check.mjs "$RUNNER_TEMP/prev/web" "$RUNNER_TEMP/gate" "$PREV_SHA"
