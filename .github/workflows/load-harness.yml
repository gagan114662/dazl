# The local load harness (load/, issue #355/#153): proves it still runs against this checkout's code. A small, fixed
# configuration on the CI runner, every outbound call fenced and every provider mocked. It checks that the harness
# works and that its thresholds hold at this size; it is NOT load acceptance (that runs on the isolated load host).
name: load-harness
on:
  pull_request:
    paths: ["load/**", ".github/workflows/load-harness.yml"]
  push:
    branches: [main]
    paths: ["load/**"]
concurrency:
  group: load-harness-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  harness:
    runs-on: [self-hosted, Linux, X64, dazl-ci]
    container:
      image: ubuntu:24.04
      options: --cpus 4 --memory 6g --memory-swap 6g --pids-limit 2048 --shm-size 1g --umask 0022
    timeout-minutes: 20
    env:
      NPM_CONFIG_CACHE: /tmp/ci-npm-cache
    defaults:
      run:
        shell: ci-bash {0}
    steps:
      - name: Isolated job prerequisites
        shell: bash
        working-directory: /
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ca-certificates curl git tar gzip xz-utils unzip python3 python3-yaml build-essential sudo sqlite3 rsync age passwd
      - uses: actions/checkout@v4
      - name: Install non-root CI command shell
        shell: bash
        working-directory: /
        run: bash "$GITHUB_WORKSPACE/.github/scripts/ci-container-bootstrap.sh"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Runner CLI rejects failed or empty work (synthetic positive and negative controls)
        run: node --test load/runner-bench.test.mjs
      - name: Scan-runner bench (mocked provider and fetch, throwaway database)
        run: node --experimental-strip-types --no-warnings load/runner-bench.ts
        env: { LOAD_TENANTS: '5', LOAD_JOBS_PER_TENANT: '2', LOAD_READERS: '2', LOAD_BASELINE_S: '1' }
      - name: Production build for the app scenario
        run: npm run build
        working-directory: web
      - name: Multi-tenant app scenario (exit 1 names a failed threshold)
        run: node --experimental-strip-types --no-warnings load/app-load.ts
        env: { LOAD_TENANTS: '20', LOAD_VUS: '10', LOAD_DURATION_S: '15' }
